<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Web Rádio</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#18181b">

  <!-- Shaka Player -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>

  <style>
    :root {
      --bg-color: #09090b;
      --card-bg: #18181b;
      --card-border: #27272a;
      --card-hover: #202024;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #e4e4e7;
      --accent-muted: #71717a;
      --live-indicator: #e11d48;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden; /* Impede a rolagem geral da tela */
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-viewport {
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
    }

    header {
      text-align: center;
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 400;
      margin-top: 2px;
    }

    /* TELA 1: SELEÇÃO DE GÊNEROS */
    #home-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .genre-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .genre-card:hover {
      background: var(--card-hover);
      border-color: #3f3f46;
    }

    .genre-name {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .genre-icon {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* TELA 2: PLAYER & HISTÓRICO */
    #player-screen {
      display: none;
      flex-direction: column;
      flex: 1;
      gap: 14px;
      min-height: 0; /* Essencial para permitir scroll filho no flexbox */
    }

    .btn-back {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
      width: fit-content;
      flex-shrink: 0;
    }

    .btn-back:hover {
      color: var(--text-main);
    }

    /* CARD DO PLAYER COMPACTO */
    .player-card-compact {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 16px 18px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }

    .player-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
      flex: 1;
    }

    .live-badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--text-muted);
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 5px;
      height: 5px;
      background: var(--live-indicator);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    /* ONDA SONORA / SOUNDWAVE ANIMATION */
    .soundwave {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }

    .soundwave .bar {
      width: 2px;
      height: 100%;
      background-color: var(--text-muted);
      border-radius: 1px;
      animation: soundwave-anim 1.2s ease-in-out infinite alternate;
      animation-play-state: paused;
    }

    .soundwave.playing .bar {
      animation-play-state: running;
      background-color: var(--accent);
    }

    .soundwave .bar:nth-child(1) { animation-delay: 0.1s; height: 30%; }
    .soundwave .bar:nth-child(2) { animation-delay: 0.3s; height: 100%; }
    .soundwave .bar:nth-child(3) { animation-delay: 0.2s; height: 60%; }
    .soundwave .bar:nth-child(4) { animation-delay: 0.4s; height: 80%; }

    @keyframes soundwave-anim {
      0% { height: 20%; }
      100% { height: 100%; }
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .track-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-genre {
      display: inline-block;
      font-size: 0.65rem;
      color: var(--accent-muted);
      margin-top: 2px;
    }

    /* BOTÃO PLAY/PAUSE */
    button.btn-play-compact {
      background: var(--accent);
      border: none;
      color: #000;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s ease, background-color 0.2s ease;
      box-shadow: 0 2px 10px rgba(255, 255, 255, 0.08);
    }

    button.btn-play-compact:active {
      transform: scale(0.92);
    }

    /* SEÇÃO HISTÓRICO COM SCROLL PRÓPRIO */
    .history-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 16px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0; /* Permite scroll interno */
    }

    .history-title {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      flex-shrink: 0;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }

    /* Estilização da Scrollbar */
    .history-list::-webkit-scrollbar,
    #home-screen::-webkit-scrollbar {
      width: 4px;
    }

    .history-list::-webkit-scrollbar-thumb,
    #home-screen::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 4px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: transparent;
      border-radius: 6px;
      border-left: 2px solid transparent;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .history-item.now-playing {
      background: #202024;
      border-left-color: var(--accent);
    }

    .history-item-info {
      text-align: left;
      overflow: hidden;
    }

    .history-item-title {
      font-size: 0.8rem;
      color: var(--text-main);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item-artist {
      font-size: 0.725rem;
      color: var(--text-muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-tag {
      font-size: 0.65rem;
      color: var(--accent-muted);
      flex-shrink: 0;
      margin-left: 8px;
    }

    audio {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <header>
      <h1>Web Rádio</h1>
      <p class="subtitle" id="page-subtitle">Selecione uma sintonia</p>
    </header>

    <audio id="audio-element" controls></audio>

    <!-- TELA 1: LISTA DE ESTILOS -->
    <div id="home-screen">
      <!-- Cards de gênero inseridos via JS -->
    </div>

    <!-- TELA 2: TRANSMISSÃO -->
    <div id="player-screen">
      <button class="btn-back" id="back-btn">← Sintonizar outro estilo</button>

      <div class="player-card-compact">
        <div class="player-left">
          <div class="live-badge-row">
            <div class="live-badge">
              <span class="live-dot"></span> Ao Vivo
            </div>
            <div class="soundwave" id="soundwave">
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
            </div>
          </div>

          <div class="track-title" id="current-title">Sintonizando...</div>
          <div class="track-artist" id="current-artist">-</div>
          <div class="track-genre" id="current-genre" style="display: none;">Gênero</div>
        </div>

        <button class="btn-play-compact" id="play-btn" title="Reproduzir / Pausar">▶</button>
      </div>

      <div class="history-section">
        <div class="history-title">Registro de Transmissão</div>
        <div class="history-list" id="history-list">
          <!-- Histórico com barra de rolagem -->
        </div>
      </div>
    </div>
  </div>

  <script>
    let playlist = [];
    let poolPlaylist = []; 
    let playedHistory = [];
    let currentTrack = null;
    let selectedGenreGlobal = 'Todos';
    let isPlaying = false;
    let shakaPlayer = null;
    let audioElement = null;

    document.addEventListener('DOMContentLoaded', () => {
      audioElement = document.getElementById('audio-element');
      setupShakaPlayer();
      setupEventListeners();
      loadPlaylist();
    });

    function setupShakaPlayer() {
      shaka.polyfill.installAll();
      if (shaka.Player.isBrowserSupported()) {
        shakaPlayer = new shaka.Player(audioElement);
        shakaPlayer.addEventListener('error', (e) => onError(e.detail));
      }
    }

    function onError(error) {
      console.error('Erro no Shaka Player:', error);
    }

    async function loadPlaylist() {
      try {
        const response = await fetch('playlist.json?v=' + new Date().getTime());
        if (!response.ok) throw new Error('Erro ao carregar playlist.json');

        playlist = await response.json();
        renderHomeGenres();

        const savedState = localStorage.getItem('radio_active_view');
        const savedGenre = localStorage.getItem('radio_selected_genre');

        if (savedState === 'player' && savedGenre) {
          startRadio(savedGenre, false);
        }
      } catch (err) {
        console.error('Erro ao carregar dados:', err);
        document.getElementById('home-screen').innerHTML = '<p style="text-align:center; color:#71717a;">Erro ao carregar programação.</p>';
      }
    }

    function renderHomeGenres() {
      const homeScreen = document.getElementById('home-screen');
      if (!homeScreen) return;

      const genres = [...new Set(playlist.map(item => item.genre).filter(Boolean))];

      let html = `
        <div class="genre-card" onclick="startRadio('Todos', true)">
          <div class="genre-name">Ouvir todos os gêneros</div>
          <div class="genre-icon">→</div>
        </div>
      `;

      genres.forEach(genre => {
        html += `
          <div class="genre-card" onclick="startRadio('${genre}', true)">
            <div class="genre-name">${genre}</div>
            <div class="genre-icon">→</div>
          </div>
        `;
      });

      homeScreen.innerHTML = html;
    }

    function startRadio(genre, isUserAction = true) {
      if (selectedGenreGlobal === genre && currentTrack && isUserAction) {
        showPlayerScreen(genre);
        return;
      }

      selectedGenreGlobal = genre;
      playedHistory = [];
      
      localStorage.setItem('radio_active_view', 'player');
      localStorage.setItem('radio_selected_genre', genre);

      const baseList = (genre === 'Todos') 
        ? [...playlist] 
        : playlist.filter(track => track.genre === genre);

      if (baseList.length === 0) return;

      poolPlaylist = shuffleArray([...baseList]);
      showPlayerScreen(genre);

      playNextRandomTrack();
    }

    function showPlayerScreen(genre) {
      document.getElementById('home-screen').style.display = 'none';
      document.getElementById('player-screen').style.display = 'flex';
      document.getElementById('page-subtitle').innerText = genre === 'Todos' ? 'Todos os Gêneros' : `${genre}`;

      const genreBadge = document.getElementById('current-genre');
      if (genre === 'Todos') {
        genreBadge.style.display = 'inline-block';
      } else {
        genreBadge.style.display = 'none';
      }
    }

    async function playNextRandomTrack() {
      if (poolPlaylist.length === 0) {
        const baseList = (selectedGenreGlobal === 'Todos') 
          ? [...playlist] 
          : playlist.filter(track => track.genre === selectedGenreGlobal);
        poolPlaylist = shuffleArray([...baseList]);
      }

      currentTrack = poolPlaylist.pop();
      playedHistory.unshift(currentTrack);

      document.getElementById('current-title').innerText = currentTrack.title || 'Sem título';
      document.getElementById('current-artist').innerText = currentTrack.artist || 'Artista desconhecido';
      
      if (selectedGenreGlobal === 'Todos') {
        document.getElementById('current-genre').innerText = currentTrack.genre || 'Geral';
      }

      renderHistoryUI();
      updateMediaSession(currentTrack);

      try {
        if (currentTrack.isDash) {
          await shakaPlayer.load(currentTrack.url);
        } else {
          await shakaPlayer.unload();
          audioElement.src = currentTrack.url;
        }

        playAudio();
      } catch (err) {
        onError(err);
      }
    }

    function updateMediaSession(track) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title || 'Sem título',
          artist: track.artist || 'Artista desconhecido',
          album: track.genre || 'Web Rádio'
        });

        navigator.mediaSession.setActionHandler('play', () => playAudio());
        navigator.mediaSession.setActionHandler('pause', () => pauseAudio());

        try {
          navigator.mediaSession.setActionHandler('seekto', null);
          navigator.mediaSession.setActionHandler('seekbackward', null);
          navigator.mediaSession.setActionHandler('seekforward', null);
        } catch (e) {}
      }
    }

    function renderHistoryUI() {
      const container = document.getElementById('history-list');
      if (!container) return;

      container.innerHTML = playedHistory.map((track, idx) => `
        <div class="history-item ${idx === 0 ? 'now-playing' : ''}">
          <div class="history-item-info">
            <div class="history-item-title">${track.title}</div>
            <div class="history-item-artist">${track.artist}</div>
          </div>
          ${(selectedGenreGlobal === 'Todos' && track.genre) ? `<span class="history-tag">${track.genre}</span>` : ''}
        </div>
      `).join('');
    }

    function showHomeScreen() {
      localStorage.setItem('radio_active_view', 'home');
      document.getElementById('player-screen').style.display = 'none';
      document.getElementById('home-screen').style.display = 'flex';
      document.getElementById('page-subtitle').innerText = 'Selecione uma sintonia';
    }

    function playAudio() {
      audioElement.play().then(() => {
        isPlaying = true;
        document.getElementById('play-btn').innerText = '⏸';
        document.getElementById('soundwave').classList.add('playing');
      }).catch(() => {
        isPlaying = false;
        document.getElementById('play-btn').innerText = '▶';
        document.getElementById('soundwave').classList.remove('playing');
      });
    }

    function pauseAudio() {
      audioElement.pause();
      isPlaying = false;
      document.getElementById('play-btn').innerText = '▶';
      document.getElementById('soundwave').classList.remove('playing');
    }

    function togglePlay() {
      if (isPlaying) {
        pauseAudio();
      } else {
        playAudio();
      }
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function setupEventListeners() {
      document.getElementById('play-btn').addEventListener('click', togglePlay);
      document.getElementById('back-btn').addEventListener('click', showHomeScreen);

      audioElement.addEventListener('durationchange', () => {
        if (audioElement.duration !== Infinity) {
          Object.defineProperty(audioElement, 'duration', {
            get: () => Infinity
          });
        }
      });

      audioElement.addEventListener('ended', () => {
        playNextRandomTrack();
      });
    }
  </script>
</body>
</html>
