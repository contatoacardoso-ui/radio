<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Web Radio</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">

  <!-- Shaka Player -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      margin-top: 10px;
      margin-bottom: 25px;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      color: #1DB954;
      margin-bottom: 5px;
    }

    p.subtitle {
      color: #b3b3b3;
      font-size: 0.9rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    /* TELA 1: SELEÇÃO DE GÊNEROS */
    #home-screen {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .genre-card {
      background: #1e1e1e;
      border: 1px solid #282828;
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .genre-card:hover {
      background: #282828;
      transform: translateY(-2px);
    }

    .genre-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
    }

    .genre-count {
      font-size: 0.8rem;
      color: #1DB954;
      background: rgba(29, 185, 84, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* TELA 2: PLAYER DE ÁUDIO */
    #player-screen {
      display: none; /* Inicia oculto */
      flex-direction: column;
      gap: 20px;
    }

    .btn-back {
      background: none;
      border: none;
      color: #1DB954;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      width: fit-content;
    }

    .player-card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
    }

    .track-info {
      margin-bottom: 20px;
    }

    .track-title {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 6px;
      color: #fff;
    }

    .track-artist {
      font-size: 1rem;
      color: #b3b3b3;
      margin-bottom: 4px;
    }

    .track-genre {
      display: inline-block;
      font-size: 0.8rem;
      background: #333;
      color: #1DB954;
      padding: 4px 12px;
      border-radius: 12px;
      margin-top: 6px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 15px;
    }

    button.btn-control {
      background: #282828;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button.btn-control:hover {
      background: #3e3e3e;
    }

    button.btn-control:active {
      transform: scale(0.95);
    }

    button.btn-play {
      background: #1DB954;
      color: #000;
      width: 65px;
      height: 65px;
      font-size: 1.5rem;
    }

    button.btn-play:hover {
      background: #1ed760;
    }

    .playlist-section {
      background: #1e1e1e;
      padding: 16px;
      border-radius: 16px;
      max-height: 250px;
      overflow-y: auto;
    }

    .playlist-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #282828;
      cursor: pointer;
      border-radius: 8px;
    }

    .playlist-item:hover {
      background: #282828;
    }

    .playlist-item.active {
      background: #282828;
      border-left: 4px solid #1DB954;
    }

    .playlist-item-title {
      font-size: 0.95rem;
      color: #fff;
    }

    .playlist-item-artist {
      font-size: 0.8rem;
      color: #b3b3b3;
    }

    .status-msg {
      text-align: center;
      font-size: 0.85rem;
      color: #888;
      margin-top: 12px;
    }

    audio {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>📻 Web Rádio</h1>
    <p class="subtitle" id="page-subtitle">Escolha um estilo para começar a ouvir</p>
  </header>

  <div class="container">
    <audio id="audio-element" controls></audio>

    <!-- TELA 1: LISTA DE ESTILOS/GÊNEROS -->
    <div id="home-screen">
      <!-- Cards gerados dinamicamente pelo JS -->
    </div>

    <!-- TELA 2: TOCADOR DE ÁUDIO -->
    <div id="player-screen">
      <button class="btn-back" id="back-btn">← Voltar para os Estilos</button>

      <div class="player-card">
        <div class="track-info">
          <div class="track-title" id="current-title">Selecione uma faixa</div>
          <div class="track-artist" id="current-artist">-</div>
          <div class="track-genre" id="current-genre">Gênero</div>
        </div>

        <div class="controls">
          <button class="btn-control" id="prev-btn" title="Anterior">⏮</button>
          <button class="btn-control btn-play" id="play-btn" title="Reproduzir/Pausar">▶</button>
          <button class="btn-control" id="next-btn" title="Próxima">⏭</button>
        </div>

        <div class="status-msg" id="status-text">Pronto</div>
      </div>

      <div class="playlist-section" id="playlist-list">
        <!-- Músicas do estilo selecionado -->
      </div>
    </div>
  </div>

  <script>
    let playlist = [];
    let filteredPlaylist = [];
    let currentIndex = 0;
    let isPlaying = false;
    let shakaPlayer = null;
    let audioElement = null;

    document.addEventListener('DOMContentLoaded', () => {
      audioElement = document.getElementById('audio-element');
      setupShakaPlayer();
      setupEventListeners();
      loadPlaylist();
    });

    function setupShakaPlayer() {
      shaka.polyfill.installAll();
      if (shaka.Player.isBrowserSupported()) {
        shakaPlayer = new shaka.Player(audioElement);
        shakaPlayer.addEventListener('error', (e) => onError(e.detail));
      }
    }

    function onError(error) {
      console.error('Erro no Shaka Player:', error);
      document.getElementById('status-text').innerText = 'Erro ao carregar áudio.';
    }

    async function loadPlaylist() {
      try {
        const response = await fetch('playlist.json?v=' + new Date().getTime());
        if (!response.ok) throw new Error('Erro ao carregar playlist.json');

        playlist = await response.json();
        renderHomeGenres();
      } catch (err) {
        console.error('Erro ao carregar dados:', err);
        document.getElementById('home-screen').innerHTML = '<p style="text-align:center; color:#888;">Erro ao carregar a playlist.</p>';
      }
    }

    // Renderiza a Tela Inicial com os Cards de Gênero
    function renderHomeGenres() {
      const homeScreen = document.getElementById('home-screen');
      if (!homeScreen) return;

      const genres = [...new Set(playlist.map(item => item.genre).filter(Boolean))];

      let html = `
        <div class="genre-card" onclick="selectGenre('Todos')">
          <div class="genre-name">🎵 Ouvir todos os gêneros</div>
          <div class="genre-count">${playlist.length} faixas</div>
        </div>
      `;

      genres.forEach(genre => {
        const count = playlist.filter(item => item.genre === genre).length;
        html += `
          <div class="genre-card" onclick="selectGenre('${genre}')">
            <div class="genre-name">${genre}</div>
            <div class="genre-count">${count} faixas</div>
          </div>
        `;
      });

      homeScreen.innerHTML = html;
    }

    // Seleciona um Gênero e Abre a Tela do Player
    function selectGenre(genre) {
      if (genre === 'Todos') {
        filteredPlaylist = [...playlist];
      } else {
        filteredPlaylist = playlist.filter(track => track.genre === genre);
      }

      // Transição de Telas
      document.getElementById('home-screen').style.display = 'none';
      document.getElementById('player-screen').style.display = 'flex';
      document.getElementById('page-subtitle').innerText = genre === 'Todos' ? 'Tocando todos os gêneros' : `Estilo: ${genre}`;

      renderPlaylistUI();
      loadTrack(0, true);
    }

    // Voltar para a Tela Inicial
    function showHomeScreen() {
      pauseAudio();
      document.getElementById('player-screen').style.display = 'none';
      document.getElementById('home-screen').style.display = 'flex';
      document.getElementById('page-subtitle').innerText = 'Escolha um estilo para começar a ouvir';
    }

    function renderPlaylistUI() {
      const container = document.getElementById('playlist-list');
      if (!container) return;

      container.innerHTML = filteredPlaylist.map((track, idx) => `
        <div class="playlist-item ${idx === currentIndex ? 'active' : ''}" onclick="loadTrack(${idx}, true)">
          <div class="playlist-item-info">
            <div class="playlist-item-title">${track.title}</div>
            <div class="playlist-item-artist">${track.artist}</div>
          </div>
          <small style="color:#1DB954;">${track.genre || ''}</small>
        </div>
      `).join('');
    }

    async function loadTrack(index, autoPlay = true) {
      if (!filteredPlaylist[index]) return;

      currentIndex = index;
      const track = filteredPlaylist[currentIndex];

      document.getElementById('current-title').innerText = track.title || 'Sem título';
      document.getElementById('current-artist').innerText = track.artist || 'Artista desconhecido';
      document.getElementById('current-genre').innerText = track.genre || 'Geral';
      document.getElementById('status-text').innerText = 'Carregando...';

      renderPlaylistUI();

      try {
        if (track.isDash) {
          await shakaPlayer.load(track.url);
        } else {
          await shakaPlayer.unload();
          audioElement.src = track.url;
        }

        if (autoPlay) {
          playAudio();
        } else {
          pauseAudio();
        }
        document.getElementById('status-text').innerText = autoPlay ? 'Tocando agora' : 'Pausado';
      } catch (err) {
        onError(err);
      }
    }

    function playAudio() {
      audioElement.play().then(() => {
        isPlaying = true;
        document.getElementById('play-btn').innerText = '⏸';
      }).catch(() => {
        isPlaying = false;
        document.getElementById('play-btn').innerText = '▶';
      });
    }

    function pauseAudio() {
      audioElement.pause();
      isPlaying = false;
      document.getElementById('play-btn').innerText = '▶';
    }

    function togglePlay() {
      if (isPlaying) {
        pauseAudio();
      } else {
        playAudio();
      }
    }

    function nextTrack() {
      if (filteredPlaylist.length === 0) return;
      let nextIndex = (currentIndex + 1) % filteredPlaylist.length;
      loadTrack(nextIndex, true);
    }

    function prevTrack() {
      if (filteredPlaylist.length === 0) return;
      let prevIndex = (currentIndex - 1 + filteredPlaylist.length) % filteredPlaylist.length;
      loadTrack(prevIndex, true);
    }

    function setupEventListeners() {
      document.getElementById('play-btn').addEventListener('click', togglePlay);
      document.getElementById('next-btn').addEventListener('click', nextTrack);
      document.getElementById('prev-btn').addEventListener('click', prevTrack);
      document.getElementById('back-btn').addEventListener('click', showHomeScreen);

      audioElement.addEventListener('ended', () => {
        nextTrack();
      });
    }
  </script>
</body>
</html>
