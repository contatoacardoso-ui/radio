<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Rádio</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#18181b">

  <!-- Shaka Player -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>

  <style>
    :root {
      --bg-color: #09090b;
      --card-bg: #18181b;
      --card-border: #27272a;
      --card-hover: #202024;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #e4e4e7;
      --accent-muted: #71717a;
      --live-indicator: #e11d48;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    header {
      margin-top: 10px;
      margin-bottom: 32px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
      font-weight: 400;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    /* TELA 1: SELEÇÃO DE GÊNEROS */
    #home-screen {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .genre-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .genre-card:hover {
      background: var(--card-hover);
      border-color: #3f3f46;
    }

    .genre-name {
      font-size: 0.975rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .genre-count {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: #27272a;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 400;
    }

    /* TELA 2: TRANSMISSÃO */
    #player-screen {
      display: none;
      flex-direction: column;
      gap: 24px;
    }

    .btn-back {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.875rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
      width: fit-content;
    }

    .btn-back:hover {
      color: var(--text-main);
    }

    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 32px 24px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: var(--live-indicator);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .track-info {
      margin-bottom: 24px;
    }

    .track-title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
      color: var(--text-main);
      line-height: 1.3;
    }

    .track-artist {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 400;
    }

    .track-genre {
      display: inline-block;
      font-size: 0.75rem;
      color: var(--accent);
      background: #27272a;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: 400;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
    }

    button.btn-play {
      background: var(--accent);
      border: none;
      color: #000;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(255, 255, 255, 0.1);
    }

    button.btn-play:hover {
      transform: scale(1.03);
      background: #ffffff;
    }

    button.btn-play:active {
      transform: scale(0.96);
    }

    /* REGISTRO DE TRANSMISSÃO */
    .history-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 20px;
      border-radius: 16px;
    }

    .history-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 500;
    }

    .history-list {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: transparent;
      border-radius: 8px;
      border-left: 2px solid transparent;
      transition: background 0.15s;
    }

    .history-item.now-playing {
      background: #202024;
      border-left-color: var(--accent);
    }

    .history-item-info {
      text-align: left;
    }

    .history-item-title {
      font-size: 0.875rem;
      color: var(--text-main);
      font-weight: 500;
    }

    .history-item-artist {
      font-size: 0.775rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .history-tag {
      font-size: 0.7rem;
      color: var(--accent-muted);
    }

    .status-msg {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 16px;
    }

    audio {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Web Rádio</h1>
    <p class="subtitle" id="page-subtitle">Selecione uma sintonia</p>
  </header>

  <div class="container">
    <audio id="audio-element" controls></audio>

    <!-- TELA 1: LISTA DE ESTILOS -->
    <div id="home-screen">
      <!-- Cards de gênero inseridos via JS -->
    </div>

    <!-- TELA 2: PLAYER DE ÁUDIO -->
    <div id="player-screen">
      <button class="btn-back" id="back-btn">← Sintonizar outro estilo</button>

      <div class="player-card">
        <div class="live-badge">
          <span class="live-dot"></span> Ao Vivo
        </div>

        <div class="track-info">
          <div class="track-title" id="current-title">Sintonizando...</div>
          <div class="track-artist" id="current-artist">-</div>
          <div class="track-genre" id="current-genre" style="display: none;">Gênero</div>
        </div>

        <div class="controls">
          <button class="btn-play" id="play-btn" title="Reproduzir / Pausar">▶</button>
        </div>

        <div class="status-msg" id="status-text">Conectando...</div>
      </div>

      <div class="history-section">
        <div class="history-title">Registro de Transmissão</div>
        <div class="history-list" id="history-list">
          <!-- Histórico montado via JS -->
        </div>
      </div>
    </div>
  </div>

  <script>
    let playlist = [];
    let poolPlaylist = []; 
    let playedHistory = [];
    let currentTrack = null;
    let selectedGenreGlobal = 'Todos';
    let isPlaying = false;
    let shakaPlayer = null;
    let audioElement = null;

    document.addEventListener('DOMContentLoaded', () => {
      audioElement = document.getElementById('audio-element');
      setupShakaPlayer();
      setupEventListeners();
      loadPlaylist();
    });

    function setupShakaPlayer() {
      shaka.polyfill.installAll();
      if (shaka.Player.isBrowserSupported()) {
        shakaPlayer = new shaka.Player(audioElement);
        shakaPlayer.addEventListener('error', (e) => onError(e.detail));
      }
    }

    function onError(error) {
      console.error('Erro no Shaka Player:', error);
      document.getElementById('status-text').innerText = 'Erro na conexão do sinal.';
    }

    async function loadPlaylist() {
      try {
        const response = await fetch('playlist.json?v=' + new Date().getTime());
        if (!response.ok) throw new Error('Erro ao carregar playlist.json');

        playlist = await response.json();
        renderHomeGenres();
      } catch (err) {
        console.error('Erro ao carregar dados:', err);
        document.getElementById('home-screen').innerHTML = '<p style="text-align:center; color:#71717a;">Erro ao carregar programação.</p>';
      }
    }

    function renderHomeGenres() {
      const homeScreen = document.getElementById('home-screen');
      if (!homeScreen) return;

      const genres = [...new Set(playlist.map(item => item.genre).filter(Boolean))];

      let html = `
        <div class="genre-card" onclick="startRadio('Todos')">
          <div class="genre-name">Ouvir todos os gêneros</div>
          <div class="genre-count">${playlist.length} faixas</div>
        </div>
      `;

      genres.forEach(genre => {
        const count = playlist.filter(item => item.genre === genre).length;
        html += `
          <div class="genre-card" onclick="startRadio('${genre}')">
            <div class="genre-name">${genre}</div>
            <div class="genre-count">${count} faixas</div>
          </div>
        `;
      });

      homeScreen.innerHTML = html;
    }

    function startRadio(genre) {
      selectedGenreGlobal = genre;
      playedHistory = [];
      
      const baseList = (genre === 'Todos') 
        ? [...playlist] 
        : playlist.filter(track => track.genre === genre);

      if (baseList.length === 0) return;

      poolPlaylist = shuffleArray([...baseList]);

      document.getElementById('home-screen').style.display = 'none';
      document.getElementById('player-screen').style.display = 'flex';
      document.getElementById('page-subtitle').innerText = genre === 'Todos' ? 'Todos os Gêneros' : `${genre}`;

      const genreBadge = document.getElementById('current-genre');
      if (genre === 'Todos') {
        genreBadge.style.display = 'inline-block';
      } else {
        genreBadge.style.display = 'none';
      }

      playNextRandomTrack();
    }

    // Toca a próxima faixa aleatória (Loop infinito sem repetição contínua)
    async function playNextRandomTrack() {
      // Se acabou o bloco atual, reembaralha e continua infinitamente
      if (poolPlaylist.length === 0) {
        const baseList = (selectedGenreGlobal === 'Todos') 
          ? [...playlist] 
          : playlist.filter(track => track.genre === selectedGenreGlobal);
        poolPlaylist = shuffleArray([...baseList]);
      }

      currentTrack = poolPlaylist.pop();
      playedHistory.unshift(currentTrack);

      // Atualiza UI da Tela
      document.getElementById('current-title').innerText = currentTrack.title || 'Sem título';
      document.getElementById('current-artist').innerText = currentTrack.artist || 'Artista desconhecido';
      
      if (selectedGenreGlobal === 'Todos') {
        document.getElementById('current-genre').innerText = currentTrack.genre || 'Geral';
      }

      document.getElementById('status-text').innerText = 'Sintonizando...';
      renderHistoryUI();

      // Configura Notificações do Sistema / Tela de Bloqueio (Media Session API)
      updateMediaSession(currentTrack);

      try {
        if (currentTrack.isDash) {
          await shakaPlayer.load(currentTrack.url);
        } else {
          await shakaPlayer.unload();
          audioElement.src = currentTrack.url;
        }

        playAudio();
        document.getElementById('status-text').innerText = 'Transmitindo ao vivo';
      } catch (err) {
        onError(err);
      }
    }

    // Atualiza a notificação do sistema do celular
    function updateMediaSession(track) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title || 'Sem título',
          artist: track.artist || 'Artista desconhecido',
          album: track.genre || 'Web Rádio' // Exibe o gênero no campo de álbum
        });

        navigator.mediaSession.setActionHandler('play', () => playAudio());
        navigator.mediaSession.setActionHandler('pause', () => pauseAudio());
      }
    }

    function renderHistoryUI() {
      const container = document.getElementById('history-list');
      if (!container) return;

      container.innerHTML = playedHistory.map((track, idx) => `
        <div class="history-item ${idx === 0 ? 'now-playing' : ''}">
          <div class="history-item-info">
            <div class="history-item-title">${track.title}</div>
            <div class="history-item-artist">${track.artist}</div>
          </div>
          ${(selectedGenreGlobal === 'Todos' && track.genre) ? `<span class="history-tag">${track.genre}</span>` : ''}
        </div>
      `).join('');
    }

    function showHomeScreen() {
      pauseAudio();
      document.getElementById('player-screen').style.display = 'none';
      document.getElementById('home-screen').style.display = 'flex';
      document.getElementById('page-subtitle').innerText = 'Selecione uma sintonia';
    }

    function playAudio() {
      audioElement.play().then(() => {
        isPlaying = true;
        document.getElementById('play-btn').innerText = '⏸';
      }).catch(() => {
        isPlaying = false;
        document.getElementById('play-btn').innerText = '▶';
      });
    }

    function pauseAudio() {
      audioElement.pause();
      isPlaying = false;
      document.getElementById('play-btn').innerText = '▶';
    }

    function togglePlay() {
      if (isPlaying) {
        pauseAudio();
      } else {
        playAudio();
      }
    }

    // Algoritmo Fisher-Yates para sorteio aleatório
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function setupEventListeners() {
      document.getElementById('play-btn').addEventListener('click', togglePlay);
      document.getElementById('back-btn').addEventListener('click', showHomeScreen);

      // Reprodução contínua automática
      audioElement.addEventListener('ended', () => {
        playNextRandomTrack();
      });
    }
  </script>
</body>
</html>
