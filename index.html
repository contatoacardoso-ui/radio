<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Web Radio - PWA</title>
  <link rel="manifest" href="manifest.json">
  <theme-color content="#121212">

  <!-- Shaka Player Compiled Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      padding: 20px;
    }

    header {
      margin-top: 10px;
      margin-bottom: 20px;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      color: #1DB954;
      margin-bottom: 5px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Card do Player */
    .player-card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
    }

    .track-info {
      margin-bottom: 20px;
    }

    .track-title {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 6px;
      color: #fff;
    }

    .track-artist {
      font-size: 1rem;
      color: #b3b3b3;
      margin-bottom: 4px;
    }

    .track-genre {
      display: inline-block;
      font-size: 0.8rem;
      background: #333;
      color: #1DB954;
      padding: 4px 12px;
      border-radius: 12px;
      margin-top: 6px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 15px;
    }

    button.btn-control {
      background: #282828;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button.btn-control:hover {
      background: #3e3e3e;
    }

    button.btn-control:active {
      transform: scale(0.95);
    }

    button.btn-play {
      background: #1DB954;
      color: #000;
      width: 65px;
      height: 65px;
      font-size: 1.5rem;
    }

    button.btn-play:hover {
      background: #1ed760;
    }

    /* Filtros por Gênero */
    .genres-section {
      background: #1e1e1e;
      padding: 16px;
      border-radius: 16px;
    }

    .genres-title {
      font-size: 0.9rem;
      color: #b3b3b3;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .genre-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .genre-btn {
      background: #282828;
      border: 1px solid #333;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .genre-btn:hover {
      background: #333;
    }

    .genre-btn.active {
      background: #1DB954;
      color: #000;
      font-weight: bold;
      border-color: #1DB954;
    }

    /* Lista da Playlist */
    .playlist-section {
      background: #1e1e1e;
      padding: 16px;
      border-radius: 16px;
      max-height: 300px;
      overflow-y: auto;
    }

    .playlist-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #282828;
      cursor: pointer;
      border-radius: 8px;
    }

    .playlist-item:hover {
      background: #282828;
    }

    .playlist-item.active {
      background: #282828;
      border-left: 4px solid #1DB954;
    }

    .playlist-item-info {
      text-align: left;
    }

    .playlist-item-title {
      font-size: 0.95rem;
      color: #fff;
    }

    .playlist-item-artist {
      font-size: 0.8rem;
      color: #b3b3b3;
    }

    .status-msg {
      text-align: center;
      font-size: 0.9rem;
      color: #888;
      margin-top: 10px;
    }

    /* Ocultar a tag HTML audio original */
    audio {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>📻 Web Rádio PWA</h1>
  </header>

  <div class="container">
    <!-- Elemento Audio para o Shaka Player -->
    <audio id="audio-element" controls></audio>

    <!-- Card Principal do Tocador -->
    <div class="player-card">
      <div class="track-info">
        <div class="track-title" id="current-title">Carregando rádio...</div>
        <div class="track-artist" id="current-artist">-</div>
        <div class="track-genre" id="current-genre">Gênero</div>
      </div>

      <div class="controls">
        <button class="btn-control" id="prev-btn" title="Anterior">⏮</button>
        <button class="btn-control btn-play" id="play-btn" title="Reproduzir/Pausar">▶</button>
        <button class="btn-control" id="next-btn" title="Próxima">⏭</button>
      </div>

      <div class="status-msg" id="status-text">Buscando playlist...</div>
    </div>

    <!-- Filtros de Gênero -->
    <div class="genres-section">
      <div class="genres-title">Filtros por Gênero</div>
      <div class="genre-buttons" id="genre-filters">
        <!-- Botões serão inseridos dinamicamente pelo JS -->
      </div>
    </div>

    <!-- Lista da Playlist Atual -->
    <div class="genres-section">
      <div class="genres-title">Fila de Reprodução</div>
      <div class="playlist-section" id="playlist-list">
        <!-- Itens da lista serão inseridos dinamicamente -->
      </div>
    </div>
  </div>

  <script>
    // Variáveis Globais
    let playlist = [];
    let filteredPlaylist = [];
    let currentIndex = 0;
    let isPlaying = false;
    let shakaPlayer = null;
    let audioElement = null;

    // Inicialização da Aplicação
    document.addEventListener('DOMContentLoaded', () => {
      audioElement = document.getElementById('audio-element');
      setupShakaPlayer();
      setupEventListeners();
      loadPlaylist();
    });

    // Configuração do Shaka Player
    function setupShakaPlayer() {
      shaka.polyfill.installAll();
      if (shaka.Player.isBrowserSupported()) {
        shakaPlayer = new shaka.Player(audioElement);
        shakaPlayer.addEventListener('error', onErrorEvent);
      } else {
        console.error('Navegador não suporta Shaka Player');
        document.getElementById('status-text').innerText = 'Erro: Navegador incompatível.';
      }
    }

    function onErrorEvent(event) {
      onError(event.detail);
    }

    function onError(error) {
      console.error('Erro no Shaka Player:', error.code, error);
      document.getElementById('status-text').innerText = 'Erro ao tocar faixa.';
    }

    // Carregar Playlist via JSON (Evitando Cache)
    async function loadPlaylist() {
      const statusText = document.getElementById('status-text');
      try {
        statusText.innerText = 'Carregando playlist...';
        
        // v=Timestamp impede que o navegador use versão cacheada antiga
        const response = await fetch('playlist.json?v=' + new Date().getTime());
        
        if (!response.ok) {
          throw new Error('Não foi possível ler playlist.json (Status: ' + response.status + ')');
        }

        playlist = await response.json();

        if (!Array.isArray(playlist) || playlist.length === 0) {
          statusText.innerText = 'A playlist está vazia.';
          return;
        }

        filteredPlaylist = [...playlist];
        renderGenres();
        renderPlaylistUI();
        loadTrack(0, false); // Prepara primeira música sem dar autoplay imediato

        statusText.innerText = 'Pronto para tocar!';
      } catch (err) {
        console.error('Falha ao carregar playlist:', err);
        statusText.innerText = 'Erro ao carregar lista de músicas.';
      }
    }

    // Renderizar Botões de Gêneros Dinamicamente
    function renderGenres() {
      const container = document.getElementById('genre-filters');
      if (!container) return;

      // Pega todos os gêneros únicos cadastrados
      const uniqueGenres = ['Todos', ...new Set(playlist.map(item => item.genre).filter(Boolean))];

      container.innerHTML = uniqueGenres.map(genre => `
        <button class="genre-btn ${genre === 'Todos' ? 'active' : ''}" data-genre="${genre}">
          ${genre === 'Todos' ? 'Ouvir todos os gêneros' : genre}
        </button>
      `).join('');

      // Adiciona clique aos novos botões
      container.querySelectorAll('.genre-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const selectedGenre = e.target.getAttribute('data-genre');
          
          container.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          
          filterPlaylist(selectedGenre);
        });
      });
    }

    // Filtrar Playlist
    function filterPlaylist(genre) {
      if (genre === 'Todos') {
        filteredPlaylist = [...playlist];
      } else {
        filteredPlaylist = playlist.filter(track => track.genre === genre);
      }

      renderPlaylistUI();

      if (filteredPlaylist.length > 0) {
        loadTrack(0, true); // Toca a primeira do novo gênero escolhido
      }
    }

    // Renderizar Lista de Músicas na Tela
    function renderPlaylistUI() {
      const container = document.getElementById('playlist-list');
      if (!container) return;

      container.innerHTML = filteredPlaylist.map((track, idx) => `
        <div class="playlist-item ${idx === currentIndex ? 'active' : ''}" onclick="selectTrack(${idx})">
          <div class="playlist-item-info">
            <div class="playlist-item-title">${track.title}</div>
            <div class="playlist-item-artist">${track.artist}</div>
          </div>
          <small style="color:#1DB954;">${track.genre || ''}</small>
        </div>
      `).join('');
    }

    function selectTrack(index) {
      loadTrack(index, true);
    }

    // Carregar e Tocar Música Específica
    async function loadTrack(index, autoPlay = true) {
      if (!filteredPlaylist[index]) return;

      currentIndex = index;
      const track = filteredPlaylist[currentIndex];

      document.getElementById('current-title').innerText = track.title || 'Sem título';
      document.getElementById('current-artist').innerText = track.artist || 'Artista desconhecido';
      document.getElementById('current-genre').innerText = track.genre || 'Geral';
      document.getElementById('status-text').innerText = `Carregando faixa...`;

      renderPlaylistUI();

      try {
        if (track.isDash) {
          // Carregamento via Shaka Player para streams DASH (.mpd)
          await shakaPlayer.load(track.url);
        } else {
          // Carregamento direto para arquivos de áudio comuns (.m4a, .mp3)
          await shakaPlayer.unload(); // Descarrega sessão DASH se houver
          audioElement.src = track.url;
        }

        if (autoPlay) {
          playAudio();
        } else {
          pauseAudio();
        }
        document.getElementById('status-text').innerText = autoPlay ? 'Tocando agora' : 'Pausado';
      } catch (err) {
        onError(err);
      }
    }

    // Controles de Reprodução
    function playAudio() {
      audioElement.play().then(() => {
        isPlaying = true;
        document.getElementById('play-btn').innerText = '⏸';
      }).catch(err => {
        console.warn('Autoplay bloqueado pelo navegador:', err);
        isPlaying = false;
        document.getElementById('play-btn').innerText = '▶';
      });
    }

    function pauseAudio() {
      audioElement.pause();
      isPlaying = false;
      document.getElementById('play-btn').innerText = '▶';
    }

    function togglePlay() {
      if (isPlaying) {
        pauseAudio();
      } else {
        playAudio();
      }
    }

    function nextTrack() {
      if (filteredPlaylist.length === 0) return;
      let nextIndex = (currentIndex + 1) % filteredPlaylist.length;
      loadTrack(nextIndex, true);
    }

    function prevTrack() {
      if (filteredPlaylist.length === 0) return;
      let prevIndex = (currentIndex - 1 + filteredPlaylist.length) % filteredPlaylist.length;
      loadTrack(prevIndex, true);
    }

    // Event Listeners dos Botões
    function setupEventListeners() {
      document.getElementById('play-btn').addEventListener('click', togglePlay);
      document.getElementById('next-btn').addEventListener('click', nextTrack);
      document.getElementById('prev-btn').addEventListener('click', prevTrack);

      // Passar para a próxima música automaticamente ao terminar
      audioElement.addEventListener('ended', () => {
        nextTrack();
      });
    }
  </script>
</body>
</html>
