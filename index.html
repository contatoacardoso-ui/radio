<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Web Radio</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">

  <!-- Shaka Player -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      margin-top: 10px;
      margin-bottom: 25px;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      color: #1DB954;
      margin-bottom: 5px;
    }

    p.subtitle {
      color: #b3b3b3;
      font-size: 0.9rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    /* TELA 1: SELEÇÃO DE GÊNEROS */
    #home-screen {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .genre-card {
      background: #1e1e1e;
      border: 1px solid #282828;
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .genre-card:hover {
      background: #282828;
      transform: translateY(-2px);
    }

    .genre-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
    }

    .genre-count {
      font-size: 0.8rem;
      color: #1DB954;
      background: rgba(29, 185, 84, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* TELA 2: PLAYER DE ÁUDIO */
    #player-screen {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .btn-back {
      background: none;
      border: none;
      color: #1DB954;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      width: fit-content;
    }

    .player-card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 0, 0, 0.2);
      color: #ff4d4d;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #ff4d4d;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .track-info {
      margin-bottom: 20px;
    }

    .track-title {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 6px;
      color: #fff;
    }

    .track-artist {
      font-size: 1.05rem;
      color: #b3b3b3;
      margin-bottom: 4px;
    }

    .track-genre {
      display: inline-block;
      font-size: 0.8rem;
      background: #333;
      color: #1DB954;
      padding: 4px 12px;
      border-radius: 12px;
      margin-top: 6px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 15px;
    }

    button.btn-play {
      background: #1DB954;
      border: none;
      color: #000;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      font-size: 1.8rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button.btn-play:hover {
      background: #1ed760;
    }

    button.btn-play:active {
      transform: scale(0.95);
    }

    /* HISTÓRICO DE REPRODUÇÃO */
    .history-section {
      background: #1e1e1e;
      padding: 16px;
      border-radius: 16px;
    }

    .history-title {
      font-size: 0.85rem;
      color: #b3b3b3;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .history-list {
      max-height: 250px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #252525;
      border-radius: 8px;
    }

    .history-item.now-playing {
      background: #2a3a2e;
      border-left: 4px solid #1DB954;
    }

    .history-item-info {
      text-align: left;
    }

    .history-item-title {
      font-size: 0.95rem;
      color: #fff;
      font-weight: 500;
    }

    .history-item-artist {
      font-size: 0.8rem;
      color: #b3b3b3;
    }

    .history-tag {
      font-size: 0.75rem;
      color: #1DB954;
    }

    .status-msg {
      text-align: center;
      font-size: 0.85rem;
      color: #888;
      margin-top: 12px;
    }

    audio {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>📻 Web Rádio</h1>
    <p class="subtitle" id="page-subtitle">Escolha um estilo para começar a ouvir</p>
  </header>

  <div class="container">
    <audio id="audio-element" controls></audio>

    <!-- TELA 1: LISTA DE ESTILOS -->
    <div id="home-screen">
      <!-- Cards gerados dinamicamente -->
    </div>

    <!-- TELA 2: TRANSMISSÃO AO VIVO -->
    <div id="player-screen">
      <button class="btn-back" id="back-btn">← Sintonizar outro estilo</button>

      <div class="player-card">
        <div class="live-badge">
          <span class="live-dot"></span> Ao Vivo
        </div>

        <div class="track-info">
          <div class="track-title" id="current-title">Sintonizando...</div>
          <div class="track-artist" id="current-artist">-</div>
          <div class="track-genre" id="current-genre" style="display: none;">Gênero</div>
        </div>

        <div class="controls">
          <button class="btn-play" id="play-btn" title="Reproduzir/Pausar">▶</button>
        </div>

        <div class="status-msg" id="status-text">Conectando...</div>
      </div>

      <div class="history-section">
        <div class="history-title">Registro de Transmissão</div>
        <div class="history-list" id="history-list">
          <!-- Histórico montado via JS -->
        </div>
      </div>
    </div>
  </div>

  <script>
    let playlist = [];
    let poolPlaylist = []; // Fila aleatória sem repetição
    let playedHistory = []; // Registro de músicas reproduzidas
    let currentTrack = null;
    let selectedGenreGlobal = 'Todos';
    let isPlaying = false;
    let shakaPlayer = null;
    let audioElement = null;

    document.addEventListener('DOMContentLoaded', () => {
      audioElement = document.getElementById('audio-element');
      setupShakaPlayer();
      setupEventListeners();
      loadPlaylist();
    });

    function setupShakaPlayer() {
      shaka.polyfill.installAll();
      if (shaka.Player.isBrowserSupported()) {
        shakaPlayer = new shaka.Player(audioElement);
        shakaPlayer.addEventListener('error', (e) => onError(e.detail));
      }
    }

    function onError(error) {
      console.error('Erro no Shaka Player:', error);
      document.getElementById('status-text').innerText = 'Erro ao carregar sinal da rádio.';
    }

    async function loadPlaylist() {
      try {
        const response = await fetch('playlist.json?v=' + new Date().getTime());
        if (!response.ok) throw new Error('Erro ao carregar playlist.json');

        playlist = await response.json();
        renderHomeGenres();
      } catch (err) {
        console.error('Erro ao carregar dados:', err);
        document.getElementById('home-screen').innerHTML = '<p style="text-align:center; color:#888;">Erro ao conectar com a rádio.</p>';
      }
    }

    function renderHomeGenres() {
      const homeScreen = document.getElementById('home-screen');
      if (!homeScreen) return;

      const genres = [...new Set(playlist.map(item => item.genre).filter(Boolean))];

      let html = `
        <div class="genre-card" onclick="startRadio('Todos')">
          <div class="genre-name">📻 Ouvir todos os gêneros</div>
          <div class="genre-count">${playlist.length} faixas</div>
        </div>
      `;

      genres.forEach(genre => {
        const count = playlist.filter(item => item.genre === genre).length;
        html += `
          <div class="genre-card" onclick="startRadio('${genre}')">
            <div class="genre-name">${genre}</div>
            <div class="genre-count">${count} faixas</div>
          </div>
        `;
      });

      homeScreen.innerHTML = html;
    }

    // Inicia a rádio para o gênero escolhido
    function startRadio(genre) {
      selectedGenreGlobal = genre;
      playedHistory = [];
      
      // Filtra músicas
      const baseList = (genre === 'Todos') 
        ? [...playlist] 
        : playlist.filter(track => track.genre === genre);

      if (baseList.length === 0) return;

      // Cria a fila aleatória
      poolPlaylist = shuffleArray([...baseList]);

      // Alterna interface
      document.getElementById('home-screen').style.display = 'none';
      document.getElementById('player-screen').style.display = 'flex';
      document.getElementById('page-subtitle').innerText = genre === 'Todos' ? 'Sintonizado: Todos os Gêneros' : `Sintonizado: ${genre}`;

      // Configura visibilidade do gênero
      const genreBadge = document.getElementById('current-genre');
      if (genre === 'Todos') {
        genreBadge.style.display = 'inline-block';
      } else {
        genreBadge.style.display = 'none';
      }

      playNextRandomTrack();
    }

    // Toca a próxima música aleatória da fila
    async function playNextRandomTrack() {
      if (poolPlaylist.length === 0) {
        // Recarrega e embaralha a lista quando todas já tiverem tocado
        const baseList = (selectedGenreGlobal === 'Todos') 
          ? [...playlist] 
          : playlist.filter(track => track.genre === selectedGenreGlobal);
        poolPlaylist = shuffleArray([...baseList]);
      }

      currentTrack = poolPlaylist.pop();
      playedHistory.unshift(currentTrack); // Adiciona no início do histórico

      document.getElementById('current-title').innerText = currentTrack.title || 'Sem título';
      document.getElementById('current-artist').innerText = currentTrack.artist || 'Artista desconhecido';
      
      if (selectedGenreGlobal === 'Todos') {
        document.getElementById('current-genre').innerText = currentTrack.genre || 'Geral';
      }

      document.getElementById('status-text').innerText = 'Sintonizando faixa...';
      renderHistoryUI();

      try {
        if (currentTrack.isDash) {
          await shakaPlayer.load(currentTrack.url);
        } else {
          await shakaPlayer.unload();
          audioElement.src = currentTrack.url;
        }

        playAudio();
        document.getElementById('status-text').innerText = 'Transmitindo ao vivo';
      } catch (err) {
        onError(err);
      }
    }

    // Renderiza o Histórico de Transmissão
    function renderHistoryUI() {
      const container = document.getElementById('history-list');
      if (!container) return;

      container.innerHTML = playedHistory.map((track, idx) => `
        <div class="history-item ${idx === 0 ? 'now-playing' : ''}">
          <div class="history-item-info">
            <div class="history-item-title">${idx === 0 ? '🔴 ' : ''}${track.title}</div>
            <div class="history-item-artist">${track.artist}</div>
          </div>
          ${(selectedGenreGlobal === 'Todos' && track.genre) ? `<span class="history-tag">${track.genre}</span>` : ''}
        </div>
      `).join('');
    }

    function showHomeScreen() {
      pauseAudio();
      document.getElementById('player-screen').style.display = 'none';
      document.getElementById('home-screen').style.display = 'flex';
      document.getElementById('page-subtitle').innerText = 'Escolha um estilo para começar a ouvir';
    }

    function playAudio() {
      audioElement.play().then(() => {
        isPlaying = true;
        document.getElementById('play-btn').innerText = '⏸';
      }).catch(() => {
        isPlaying = false;
        document.getElementById('play-btn').innerText = '▶';
      });
    }

    function pauseAudio() {
      audioElement.pause();
      isPlaying = false;
      document.getElementById('play-btn').innerText = '▶';
    }

    function togglePlay() {
      if (isPlaying) {
        pauseAudio();
      } else {
        playAudio();
      }
    }

    // Função para embaralhar array (Algoritmo Fisher-Yates)
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function setupEventListeners() {
      document.getElementById('play-btn').addEventListener('click', togglePlay);
      document.getElementById('back-btn').addEventListener('click', showHomeScreen);

      // Quando a música atual termina, a rádio seleciona e toca a próxima automaticamente
      audioElement.addEventListener('ended', () => {
        playNextRandomTrack();
      });
    }
  </script>
</body>
</html>
