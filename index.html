<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>Central de Rádios</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#18181b">

  <!-- Shaka Player -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>

  <style>
    :root {
      --bg-color: #09090b;
      --card-bg: #18181b;
      --card-border: #27272a;
      --card-hover: #202024;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #f4f4f5;
      --accent-muted: #71717a;
      --live-indicator: #e11d48;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-x pan-y;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-viewport {
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      position: relative;
    }

    header {
      text-align: center;
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 400;
      margin-top: 2px;
    }

    #home-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      padding-right: 2px;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
      min-height: 0;
    }

    .genre-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
      outline: none;
    }

    .genre-card:hover, .genre-card:focus {
      background: var(--card-hover);
      border-color: #52525b;
      transform: scale(1.01);
    }

    .genre-name {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .genre-icon {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .mini-player {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      flex-shrink: 0;
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .mini-player-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
      flex: 1;
      margin-right: 12px;
      min-width: 0;
    }

    .marquee-container {
      overflow: hidden;
      white-space: nowrap;
      width: 100%;
      position: relative;
      display: block;
    }

    .track-title, .mini-player-title {
      display: inline-block;
      white-space: nowrap;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      width: auto;
      transition: transform 0.1s linear;
    }

    .mini-player-title {
      font-size: 0.85rem;
    }

    .mini-player-subtitle, .track-artist {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-player-subtitle {
      font-size: 0.75rem;
    }

    .mini-player-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #player-screen {
      display: none;
      flex-direction: column;
      flex: 1;
      gap: 12px;
      min-height: 0;
    }

    .btn-back {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
      width: fit-content;
      flex-shrink: 0;
    }

    .btn-back:hover, .btn-back:focus {
      color: var(--text-main);
      outline: none;
    }

    .player-card-compact {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 16px 18px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }

    .player-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
      flex: 1;
      min-width: 0;
    }

    .live-badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--text-muted);
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 5px;
      height: 5px;
      background: var(--live-indicator);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .soundwave {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }

    .soundwave .bar {
      width: 2px;
      height: 100%;
      background-color: var(--text-muted);
      border-radius: 1px;
      animation: soundwave-anim 1.2s ease-in-out infinite alternate;
      animation-play-state: paused;
    }

    .soundwave.playing .bar {
      animation-play-state: running;
      background-color: var(--accent);
    }

    .soundwave .bar:nth-child(1) { animation-delay: 0.1s; height: 30%; }
    .soundwave .bar:nth-child(2) { animation-delay: 0.3s; height: 100%; }
    .soundwave .bar:nth-child(3) { animation-delay: 0.2s; height: 60%; }
    .soundwave .bar:nth-child(4) { animation-delay: 0.4s; height: 80%; }

    @keyframes soundwave-anim {
      0% { height: 20%; }
      100% { height: 100%; }
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .track-genre {
      display: inline-block;
      font-size: 0.65rem;
      color: var(--accent-muted);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 500;
    }

    button.btn-play-compact {
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #f4f4f5;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }

    button.btn-play-compact.mini {
      width: 38px;
      height: 38px;
    }

    button.btn-play-compact:hover, button.btn-play-compact:focus {
      background: #3f3f46;
      border-color: #52525b;
      transform: scale(1.03);
    }

    button.btn-play-compact:active {
      transform: scale(0.95);
      background: #18181b;
    }

    button.btn-play-compact svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    button.btn-play-compact.mini svg {
      width: 15px;
      height: 15px;
    }

    .history-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 14px 16px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .history-title {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      flex-shrink: 0;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }

    .history-list::-webkit-scrollbar,
    #home-screen::-webkit-scrollbar {
      width: 4px;
    }

    .history-list::-webkit-scrollbar-thumb,
    #home-screen::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 4px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #202024;
      border-radius: 6px;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .history-item-info {
      text-align: left;
      overflow: hidden;
    }

    .history-item-title {
      font-size: 0.8rem;
      color: var(--text-main);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item-artist {
      font-size: 0.725rem;
      color: var(--text-muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-tag {
      font-size: 0.65rem;
      color: var(--accent-muted);
      flex-shrink: 0;
      margin-left: 8px;
    }

    .empty-history {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.775rem;
      padding: 16px 0;
    }

    audio {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <header>
      <h1>Central de Rádios</h1>
      <p class="subtitle" id="page-subtitle">Selecione uma sintonia</p>
    </header>

    <audio id="audio-element" controls preload="auto"></audio>

    <!-- Tela Principal -->
    <div id="home-screen">
      <!-- Lista de Rádios -->
    </div>

    <!-- Mini-Player na Tela Principal (Agora com Ao Vivo + Gênero) -->
    <div class="mini-player" id="mini-player" tabindex="0" onclick="restorePlayerFromMini()">
      <div class="mini-player-info">
        <div class="live-badge-row">
          <div class="live-badge">
            <span class="live-dot"></span> Ao Vivo
          </div>
          <div class="soundwave" id="mini-soundwave">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
        </div>
        <div class="marquee-container">
          <div class="mini-player-title" id="mini-title">Música Atual</div>
        </div>
        <div class="mini-player-subtitle" id="mini-artist">Artista</div>
        <div class="track-genre" id="mini-genre" style="display: none;">Gênero</div>
      </div>
      <div class="mini-player-controls" onclick="event.stopPropagation()">
        <button class="btn-play-compact mini" id="mini-play-btn" title="Reproduzir / Pausar">
          <svg id="mini-svg-play" viewBox="0 0 24 24">
            <polygon points="6 3 20 12 6 21 6 3" fill="currentColor" stroke="none"></polygon>
          </svg>
          <svg id="mini-svg-pause" viewBox="0 0 24 24" style="display: none;">
            <rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"></rect>
          </svg>
        </button>
      </div>
    </div>

    <!-- Tela Interna do Player -->
    <div id="player-screen">
      <button class="btn-back" id="back-btn">← Trocar Rádio</button>

      <div class="player-card-compact">
        <div class="player-left">
          <div class="live-badge-row">
            <div class="live-badge">
              <span class="live-dot"></span> Ao Vivo
            </div>
            <div class="soundwave" id="soundwave">
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
            </div>
          </div>

          <div class="marquee-container">
            <div class="track-title" id="current-title">Sintonizando...</div>
          </div>
          <div class="track-artist" id="current-artist">-</div>
          <div class="track-genre" id="current-genre" style="display: none;">Gênero</div>
        </div>

        <button class="btn-play-compact" id="play-btn" title="Reproduzir / Pausar">
          <svg id="svg-play" viewBox="0 0 24 24">
            <polygon points="6 3 20 12 6 21 6 3" fill="currentColor" stroke="none"></polygon>
          </svg>
          <svg id="svg-pause" viewBox="0 0 24 24" style="display: none;">
            <rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"></rect>
          </svg>
        </button>
      </div>

      <div class="history-section">
        <div class="history-title">Registro de Transmissão</div>
        <div class="history-list" id="history-list">
          <!-- Histórico -->
        </div>
      </div>
    </div>
  </div>

  <script>
    var playlist = [];
    var poolPlaylist = []; 
    var playedHistory = [];
    var currentTrack = null;
    var selectedGenreGlobal = null;
    var isPlaying = false;
    var shakaPlayer = null;
    var audioElement = null;
    var marqueeIntervals = {};

    document.addEventListener('DOMContentLoaded', function() {
      audioElement = document.getElementById('audio-element');
      blockAllZoom();
      setupShakaPlayer();
      setupEventListeners();
      loadPlaylist();
    });

    function blockAllZoom() {
      document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });

      document.addEventListener('touchstart', function(e) {
        if (e.touches && e.touches.length > 1) e.preventDefault();
      }, { passive: false });

      document.addEventListener('touchmove', function(e) {
        if (e.touches && e.touches.length > 1) e.preventDefault();
      }, { passive: false });

      var lastTouchTime = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTouchTime <= 300) e.preventDefault();
        lastTouchTime = now;
      }, { passive: false });

      document.addEventListener('wheel', function(e) {
        if (e.ctrlKey) e.preventDefault();
      }, { passive: false });

      document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
          e.preventDefault();
        }
      });
    }

    function setupShakaPlayer() {
      try {
        if (typeof shaka !== 'undefined') {
          shaka.polyfill.installAll();
          if (shaka.Player.isBrowserSupported()) {
            shakaPlayer = new shaka.Player(audioElement);
            shakaPlayer.addEventListener('error', function(e) { onError(e.detail); });
          }
        }
      } catch (err) {
        console.warn('Shaka Player indisponível ou falhou ao inicializar:', err);
      }
    }

    function onError(error) {
      console.error('Erro de reprodução:', error);
    }

    async function loadPlaylist() {
      var homeScreen = document.getElementById('home-screen');
      try {
        var cacheBust = '?v=' + new Date().getTime();
        var response;
        try {
          response = await fetch('./playlist.json' + cacheBust);
        } catch (e) {
          response = await fetch('playlist.json' + cacheBust);
        }

        if (!response.ok) throw new Error('Falha ao obter playlist.json');

        playlist = await response.json();
        renderHomeGenres();

        var navEntries = performance.getEntriesByType ? performance.getEntriesByType("navigation") : [];
        var navigationType = navEntries.length > 0 ? navEntries[0].type : '';
        var savedGenre = sessionStorage.getItem('radio_selected_genre');
        var savedTrackRaw = sessionStorage.getItem('radio_current_track');

        if (navigationType === 'reload' && savedGenre && savedTrackRaw) {
          var savedTrack = JSON.parse(savedTrackRaw);
          resumeRadioOnReload(savedGenre, savedTrack);
        } else {
          sessionStorage.clear();
          showHomeScreen();
        }
      } catch (err) {
        console.error('Erro ao carregar dados:', err);
        if (homeScreen) {
          homeScreen.innerHTML = '<p style="text-align:center; color:#a1a1aa; padding: 20px 0;">Erro ao carregar lista de rádios. Verifique o arquivo playlist.json.</p>';
        }
      }
    }

    function renderHomeGenres() {
      var homeScreen = document.getElementById('home-screen');
      if (!homeScreen) return;

      var genres = [];
      for (var i = 0; i < playlist.length; i++) {
        if (playlist[i].genre && genres.indexOf(playlist[i].genre) === -1) {
          genres.push(playlist[i].genre);
        }
      }

      var html = `
        <div class="genre-card" tabindex="0" onclick="startRadio('Todos', true)" onkeydown="if(event.key==='Enter'||event.keyCode===13) startRadio('Todos', true)">
          <div class="genre-name">Ouvir Todas</div>
          <div class="genre-icon">→</div>
        </div>
      `;

      genres.forEach(function(genre) {
        html += `
          <div class="genre-card" tabindex="0" onclick="startRadio('${genre}', true)" onkeydown="if(event.key==='Enter'||event.keyCode===13) startRadio('${genre}', true)">
            <div class="genre-name">${genre}</div>
            <div class="genre-icon">→</div>
          </div>
        `;
      });

      homeScreen.innerHTML = html;
    }

    function checkAndApplyMarquee(elementId) {
      setTimeout(function() {
        var el = document.getElementById(elementId);
        if (!el || !el.parentElement) return;

        if (marqueeIntervals[elementId]) {
          clearInterval(marqueeIntervals[elementId]);
          delete marqueeIntervals[elementId];
        }

        el.style.transform = 'translateX(0px)';

        var containerWidth = el.parentElement.clientWidth;
        var textWidth = el.scrollWidth;

        if (textWidth > containerWidth && containerWidth > 0) {
          var maxScroll = textWidth - containerWidth + 12;
          var pos = 0;
          var direction = 1; 
          var pauseTicks = 0;

          marqueeIntervals[elementId] = setInterval(function() {
            if (pauseTicks > 0) {
              pauseTicks--;
              return;
            }

            if (direction === 1) {
              pos += 1;
              if (pos >= maxScroll) {
                pos = maxScroll;
                direction = -1;
                pauseTicks = 30; 
              }
            } else {
              pos -= 1;
              if (pos <= 0) {
                pos = 0;
                direction = 1;
                pauseTicks = 40; 
              }
            }

            el.style.transform = 'translateX(-' + pos + 'px)';
          }, 40);
        }
      }, 150);
    }

    function updateTrackDisplay() {
      if (!currentTrack) return;

      // Player Expandido
      document.getElementById('current-title').innerText = currentTrack.title || 'Sem título';
      document.getElementById('current-artist').innerText = currentTrack.artist || 'Artista desconhecido';

      // Mini-Player (Tela Principal)
      document.getElementById('mini-title').innerText = currentTrack.title || 'Sem título';
      document.getElementById('mini-artist').innerText = currentTrack.artist || 'Artista desconhecido';

      // Exibição da Tag do Gênero (Player Expandido)
      var genreBadge = document.getElementById('current-genre');
      if (selectedGenreGlobal === 'Todos' && currentTrack.genre) {
        genreBadge.innerText = currentTrack.genre;
        genreBadge.style.display = 'inline-block';
      } else {
        genreBadge.style.display = 'none';
      }

      // Exibição da Tag do Gênero (Mini-Player na Tela Principal)
      var miniGenreBadge = document.getElementById('mini-genre');
      if (selectedGenreGlobal === 'Todos' && currentTrack.genre) {
        miniGenreBadge.innerText = currentTrack.genre;
        miniGenreBadge.style.display = 'inline-block';
      } else {
        miniGenreBadge.style.display = 'none';
      }

      checkAndApplyMarquee('current-title');
      checkAndApplyMarquee('mini-title');
    }

    function renderHistoryUI() {
      var container = document.getElementById('history-list');
      if (!container) return;

      if (playedHistory.length === 0) {
        container.innerHTML = '<div class="empty-history">Primeira faixa da sintonia atual</div>';
        return;
      }

      var html = '';
      playedHistory.forEach(function(track) {
        html += `
          <div class="history-item">
            <div class="history-item-info">
              <div class="history-item-title">${track.title}</div>
              <div class="history-item-artist">${track.artist}</div>
            </div>
            ${(selectedGenreGlobal === 'Todos' && track.genre) ? `<span class="history-tag">${track.genre}</span>` : ''}
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function startRadio(genre, isUserAction) {
      if (typeof isUserAction === 'undefined') isUserAction = true;

      if (selectedGenreGlobal === genre && currentTrack) {
        showPlayerScreen(genre);
        return;
      }

      selectedGenreGlobal = genre;
      playedHistory = [];
      currentTrack = null;

      sessionStorage.setItem('radio_selected_genre', genre);

      if (history.state && history.state.view !== 'player') {
        history.pushState({ view: 'player' }, '');
      }

      var baseList = (genre === 'Todos') 
        ? playlist.slice() 
        : playlist.filter(function(track) { return track.genre === genre; });

      if (baseList.length === 0) return;

      poolPlaylist = shuffleArray(baseList.slice());
      showPlayerScreen(genre);

      playNextRandomTrack(false);
    }

    async function resumeRadioOnReload(genre, track) {
      selectedGenreGlobal = genre;
      currentTrack = track;
      playedHistory = [];

      var baseList = (genre === 'Todos') 
        ? playlist.slice() 
        : playlist.filter(function(item) { return item.genre === genre; });

      poolPlaylist = shuffleArray(baseList.filter(function(item) { return item.url !== track.url; }));

      showPlayerScreen(genre);
      updateTrackDisplay();
      renderHistoryUI();

      updateMediaSession(currentTrack);

      try {
        if (currentTrack.isDash && shakaPlayer) {
          await shakaPlayer.load(currentTrack.url);
        } else {
          if (shakaPlayer) await shakaPlayer.unload();
          audioElement.src = currentTrack.url;
        }

        playAudio();
      } catch (err) {
        onError(err);
      }
    }

    function showPlayerScreen(genre) {
      document.getElementById('home-screen').style.display = 'none';
      document.getElementById('mini-player').style.display = 'none';
      document.getElementById('player-screen').style.display = 'flex';
      document.getElementById('page-subtitle').innerText = genre === 'Todos' ? 'Todas as Rádios' : '' + genre;

      if (currentTrack) {
        updateTrackDisplay();
        renderHistoryUI();
      }
    }

    async function playNextRandomTrack(isAutoNext) {
      if (typeof isAutoNext === 'undefined') isAutoNext = true;

      if (isAutoNext && currentTrack) {
        playedHistory.unshift(currentTrack);
      }

      if (poolPlaylist.length === 0) {
        var baseList = (selectedGenreGlobal === 'Todos') 
          ? playlist.slice() 
          : playlist.filter(function(track) { return track.genre === selectedGenreGlobal; });
        poolPlaylist = shuffleArray(baseList.slice());
      }

      currentTrack = poolPlaylist.pop();

      sessionStorage.setItem('radio_current_track', JSON.stringify(currentTrack));

      updateTrackDisplay();
      renderHistoryUI();
      updateMediaSession(currentTrack);

      try {
        if (currentTrack.isDash && shakaPlayer) {
          await shakaPlayer.load(currentTrack.url);
        } else {
          if (shakaPlayer) await shakaPlayer.unload();
          audioElement.src = currentTrack.url;
        }

        playAudio();
      } catch (err) {
        onError(err);
      }
    }

    function updateMediaSession(track) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title || 'Sem título',
          artist: track.artist || 'Artista desconhecido',
          album: track.genre || 'Central de Rádios'
        });

        navigator.mediaSession.setActionHandler('play', function() { playAudio(); });
        navigator.mediaSession.setActionHandler('pause', function() { pauseAudio(); });

        try {
          navigator.mediaSession.setActionHandler('seekto', null);
          navigator.mediaSession.setActionHandler('seekbackward', null);
          navigator.mediaSession.setActionHandler('seekforward', null);
        } catch (e) {}
      }
    }

    function showHomeScreen() {
      document.getElementById('player-screen').style.display = 'none';
      document.getElementById('home-screen').style.display = 'flex';
      document.getElementById('page-subtitle').innerText = 'Selecione uma sintonia';

      if (currentTrack) {
        document.getElementById('mini-player').style.display = 'flex';
        updateTrackDisplay();
      } else {
        document.getElementById('mini-player').style.display = 'none';
      }
    }

    function restorePlayerFromMini() {
      showPlayerScreen(selectedGenreGlobal);
      if (history.state && history.state.view !== 'player') {
        history.pushState({ view: 'player' }, '');
      }
    }

    function playAudio() {
      var promise = audioElement.play();
      if (promise !== undefined) {
        promise.then(function() {
          isPlaying = true;
          document.getElementById('svg-play').style.display = 'none';
          document.getElementById('svg-pause').style.display = 'block';
          document.getElementById('soundwave').classList.add('playing');

          document.getElementById('mini-svg-play').style.display = 'none';
          document.getElementById('mini-svg-pause').style.display = 'block';
          document.getElementById('mini-soundwave').classList.add('playing');
        }).catch(function(error) {
          console.warn("Autoplay bloqueado pelo navegador. Aguardando interação:", error);
          isPlaying = false;
          
          document.getElementById('svg-play').style.display = 'block';
          document.getElementById('svg-pause').style.display = 'none';
          document.getElementById('soundwave').classList.remove('playing');

          document.getElementById('mini-svg-play').style.display = 'block';
          document.getElementById('mini-svg-pause').style.display = 'none';
          document.getElementById('mini-soundwave').classList.remove('playing');

          var unlockAudioOnInteraction = function() {
            audioElement.play().then(function() {
              isPlaying = true;
              document.getElementById('svg-play').style.display = 'none';
              document.getElementById('svg-pause').style.display = 'block';
              document.getElementById('soundwave').classList.add('playing');

              document.getElementById('mini-svg-play').style.display = 'none';
              document.getElementById('mini-svg-pause').style.display = 'block';
              document.getElementById('mini-soundwave').classList.add('playing');
            }).catch(function() {});

            window.removeEventListener('click', unlockAudioOnInteraction);
            window.removeEventListener('touchstart', unlockAudioOnInteraction);
            window.removeEventListener('keydown', unlockAudioOnInteraction);
          };

          window.addEventListener('click', unlockAudioOnInteraction, { once: true });
          window.addEventListener('touchstart', unlockAudioOnInteraction, { once: true });
          window.addEventListener('keydown', unlockAudioOnInteraction, { once: true });
        });
      }
    }

    function pauseAudio() {
      audioElement.pause();
      isPlaying = false;
      document.getElementById('svg-play').style.display = 'block';
      document.getElementById('svg-pause').style.display = 'none';
      document.getElementById('soundwave').classList.remove('playing');

      document.getElementById('mini-svg-play').style.display = 'block';
      document.getElementById('mini-svg-pause').style.display = 'none';
      document.getElementById('mini-soundwave').classList.remove('playing');
    }

    function togglePlay() {
      if (isPlaying) {
        pauseAudio();
      } else {
        playAudio();
      }
    }

    function shuffleArray(array) {
      for (var i = array.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = array[i];
        array[i] = array[j];
        array[j] = temp;
      }
      return array;
    }

    function setupEventListeners() {
      document.getElementById('play-btn').addEventListener('click', togglePlay);
      document.getElementById('mini-play-btn').addEventListener('click', function(e) {
        e.stopPropagation();
        togglePlay();
      });

      document.getElementById('back-btn').addEventListener('click', function() {
        if (history.state && history.state.view === 'player') {
          history.back();
        } else {
          showHomeScreen();
        }
      });

      window.addEventListener('popstate', function(e) {
        showHomeScreen();
      });

      audioElement.addEventListener('durationchange', function() {
        if (audioElement.duration !== Infinity) {
          Object.defineProperty(audioElement, 'duration', {
            get: function() { return Infinity; }
          });
        }
      });

      audioElement.addEventListener('ended', function() {
        playNextRandomTrack(true);
      });
    }
  </script>
</body>
</html>
