<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Configurações PWA Mobile -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WebRadio">
    <meta name="theme-color" content="#121212">
    
    <!-- Ícone do App -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23121212'/><circle cx='50' cy='50' r='30' fill='%2300f2ff'/><polygon points='43,38 65,50 43,62' fill='%23121212'/></svg>">
    
    <!-- Manifest Embutido -->
    <link rel="manifest" href="data:application/manifest+json;utf8,{
        %22name%22:%22WebRadio%20App%22,
        %22short_name%22:%22WebRadio%22,
        %22start_url%22:%22.%22,
        %22display%22:%22standalone%22,
        %22background_color%22:%22%23121212%22,
        %22theme_color%22:%22%2300f2ff%22,
        %22icons%22:[{%22src%22:%22data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23121212'/><circle cx='50' cy='50' r='30' fill='%2300f2ff'/><polygon points='43,38 65,50 43,62' fill='%23121212'/></svg>%22,%22sizes%22:%22192x192%22,%22type%22:%22image/svg+xml%22}]
    }">
    
    <title>WebRadio Mobile</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    
    <style>
        :root {
            --accent: #00f2ff;
            --bg-main: #121212;
            --bg-card: #181818;
            --text-main: #ffffff;
            --text-muted: #888888;
            --bottom-bar-h: 75px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Tela de Seleção de Gênero (Overlay) */
        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(18, 18, 18, 0.98);
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .start-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .genre-selector-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .genre-selector-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .genre-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 320px;
        }

        .genre-btn {
            background: var(--bg-card);
            border: 1px solid #2a2a2a;
            color: var(--text-main);
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .genre-btn:active { transform: scale(0.97); }

        .genre-btn.primary {
            background: var(--accent);
            color: #000;
            border: none;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
            margin-bottom: 5px;
        }

        /* Top Header */
        .app-header {
            padding: 20px 20px 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #222;
            z-index: 10;
        }

        .app-header h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-genre {
            background: var(--accent);
            color: #000;
            font-size: 9px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Lista de Histórico */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: calc(var(--bottom-bar-h) + 25px);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            margin-left: 5px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .change-genre-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .history-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Item de Histórico */
        .track-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 14px 16px;
            border-radius: 12px;
            background: var(--bg-card);
            border: 1px solid #222;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .track-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-item.active {
            border-color: var(--accent);
            background: rgba(0, 242, 255, 0.05);
        }

        .track-item.active .track-title {
            color: var(--accent);
        }

        /* Mini Player Rodapé */
        .bottom-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--bottom-bar-h);
            background: rgba(22, 22, 22, 0.96);
            backdrop-filter: blur(20px);
            border-top: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            padding: 0 18px;
            gap: 12px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.7);
            z-index: 100;
        }

        .now-playing-info {
            flex: 1;
            overflow: hidden;
        }

        .now-title {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now-artist {
            font-size: 11px;
            color: var(--accent);
            margin-top: 2px;
        }

        .play-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        .play-btn svg { width: 18px; height: 18px; fill: #000; }

        .wave-box {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 16px;
        }

        .wave-bar {
            width: 3px;
            height: 4px;
            background: var(--accent);
            border-radius: 2px;
            transition: height 0.2s;
        }

        .playing .wave-bar {
            animation: wave 0.8s infinite ease-in-out;
        }

        .playing .wave-bar:nth-child(2) { animation-delay: 0.15s; }
        .playing .wave-bar:nth-child(3) { animation-delay: 0.3s; }
        .playing .wave-bar:nth-child(4) { animation-delay: 0.45s; }

        @keyframes wave {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }

        audio { display: none; }
    </style>
</head>
<body>

    <!-- Overlay de Seleção de Gêneros -->
    <div class="start-overlay" id="startOverlay">
        <div class="genre-selector-title">Escolha o Estilo</div>
        <div class="genre-selector-subtitle">Selecione o gênero para iniciar a rádio ao vivo</div>
        
        <div class="genre-grid" id="genreButtons">
            <!-- Botões de gênero gerados dinamicamente -->
        </div>
    </div>

    <!-- Header do App -->
    <header class="app-header">
        <h1>WebRadio <span class="badge-genre" id="activeGenreBadge">TODOS</span></h1>
    </header>

    <!-- Histórico de Músicas Tocadas -->
    <main class="app-content">
        <div class="section-header">
            <span class="section-title">Tocadas Recentemente</span>
            <button class="change-genre-btn" onclick="openGenreSelector()">Trocar Gênero</button>
        </div>
        <div class="history-container" id="historyItems">
            <!-- As músicas que forem tocadas aparecerão aqui -->
        </div>
    </main>

    <!-- Mini Player Rodapé -->
    <div class="bottom-player" id="playerBar">
        <button class="play-btn" onclick="togglePlay()">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <div class="now-playing-info">
            <div class="now-title" id="trackTitle">Sintonizando...</div>
            <div class="now-artist" id="trackArtist">Aguarde</div>
        </div>

        <div class="wave-box" id="waveBox">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
        </div>
    </div>

    <audio id="audioEngine"></audio>

    <script>
        const masterPlaylist = [
            {
                title: "Hip Hop Journal Episode 106 w",
                artist: "DJ Stikmand",
		genre: "Hip-Hop & Rap",
                url: "https://dl.mixcloud.stream/secure/c/m4a/64/c/5/0/1/3227-e125-4f71-8f0e-1385ceb2e079.m4a?sig=_xKR0Y1UF2g9dMd2HYwWOg",
                isDash: true
            },
            {
                title: "The Up In Smoke Madd Tour Mix - Pt 1",
                artist: "Dailey Maddawg",
                genre: "Hip-Hop & Rap",
		url: "https://dl.mixcloud.stream/secure/c/m4a/64/c/7/d/b/d50a-85a7-4463-8fbc-8bfd07672c56.m4a?sig=szJXEWTyLHy2RxU3ewcQ8Q",
                isDash: false
            },
            {
                title: "MiXturada",
                artist: "Gimenes Grooveria",
		genre: "Hip-Hop & Rap",
                url: "https://dl.mixcloud.stream/secure/c/m4a/64/6/e/3/8/01b4-d881-4a02-b618-a5b2b8f252e4.m4a?sig=l3UhlXVp23zNTklmvuiiNA",
                isDash: false
            },
	        {
                title: "Chicos No Samba",
                artist: "Gimenes Grooveria",
		genre: "Samba & MPB",
                url: "https://dl.mixcloud.stream/secure/c/m4a/64/8/c/6/1/b85b-70cc-41b3-a161-8bc6fc722289.m4a?sig=2-G0YLXnoVSZlrHTX27JFQ",
                isDash: false
            },
	        {
                title: "Jorges",
                artist: "Gimenes Grooveria",
                genre: "Samba & MPB",
		url: "https://dl.mixcloud.stream/secure/c/m4a/64/9/c/2/f/ef45-8b98-402c-bee3-ed07afd49ae8.m4a?sig=iAr9NwruaI5HlXceCUm1ww",
                isDash: false
            },
	        {
                title: "2000s Rock",
                artist: "Deezer",
                genre: "Rock",
		url: "https://dl.mixcloud.stream/secure/c/m4a/64/a/3/0/2/f700-3325-4d37-bfd3-80afdda3f4f6.m4a?sig=wQTGgAX_pO23f46Uv3rEAQ",
                isDash: false
            },
            {
                title: "Bravus Vol. 1",
                artist: "Samba em Família",
                genre: "Samba & MPB",
		url: "https://dl.mixcloud.stream/secure/c/m4a/64/c/b/3/6/f4c8-e919-4ccc-96a7-254469bd2c65.m4a?sig=lL3zIWWikf-M8-kVrGUDvA",
                isDash: false
            }  
            {
                title: "American Music Awards 2001 (Part 2)",
                artist: "Dailey Maddawg",
                genre: "Rock",
		url: "https://dl.mixcloud.stream/secure/c/m4a/64/d/c/4/6/55c4-d498-4cf8-b1af-131ca1c5e626.m4a?sig=lNSHUiQF1blPYXJUY3126g",
                isDash: false
            }  
		];
		
        let activePlaylist = [];
        let playedHistory = [];
        let currentIndex = -1;
        let selectedGenre = "ALL";
        let shakaPlayer;

        const audio = document.getElementById('audioEngine');
        const playIcon = document.getElementById('playIcon');
        const playerBar = document.getElementById('playerBar');

        async function initApp() {
            shaka.polyfill.installAll();
            shakaPlayer = new shaka.Player(audio);

            renderGenreButtons();

            audio.onended = () => {
                playRandomTrack();
            };
        }

        function renderGenreButtons() {
            const container = document.getElementById('genreButtons');
            container.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.className = 'genre-btn primary';
            allBtn.innerHTML = `<span>Ouvir Todos os Gêneros</span> ➔`;
            allBtn.onclick = () => selectGenreAndStart("ALL");
            container.appendChild(allBtn);

            const genres = [...new Set(masterPlaylist.map(item => item.genre))];
            
            genres.forEach(genre => {
                const btn = document.createElement('button');
                btn.className = 'genre-btn';
                btn.innerHTML = `<span>${genre}</span> ➔`;
                btn.onclick = () => selectGenreAndStart(genre);
                container.appendChild(btn);
            });
        }

        function openGenreSelector() {
            document.getElementById('startOverlay').classList.remove('hidden');
        }

        function selectGenreAndStart(genre) {
            selectedGenre = genre;
            document.getElementById('activeGenreBadge').innerText = genre === "ALL" ? "TODOS" : genre;
            
            if (genre === "ALL") {
                activePlaylist = [...masterPlaylist];
            } else {
                activePlaylist = masterPlaylist.filter(item => item.genre === genre);
            }

            playedHistory = [];
            currentIndex = -1;
            document.getElementById('historyItems').innerHTML = '';

            document.getElementById('startOverlay').classList.add('hidden');
            
            audio.play().catch(() => {});
            playRandomTrack();
        }

        function playRandomTrack() {
            if (activePlaylist.length === 0) return;

            let nextIndex;
            if (activePlaylist.length > 1) {
                do {
                    nextIndex = Math.floor(Math.random() * activePlaylist.length);
                } while (nextIndex === currentIndex);
            } else {
                nextIndex = 0;
            }

            currentIndex = nextIndex;
            loadTrack(currentIndex);
        }

        async function loadTrack(index) {
            const track = activePlaylist[index];
            document.getElementById('trackTitle').innerText = track.title;
            document.getElementById('trackArtist').innerText = track.artist;

            addTrackToHistory(track);

            try {
                if (track.isDash) {
                    await shakaPlayer.load(track.url);
                } else {
                    await shakaPlayer.unload();
                    audio.src = track.url;
                }

                await audio.play();
                setUIState(true);
            } catch (e) {
                console.error("Erro ao carregar faixa, sorteando outra...", e);
                setTimeout(playRandomTrack, 1000);
            }
        }

        function addTrackToHistory(track) {
            playedHistory.unshift(track);
            renderHistoryUI();
        }

        function renderHistoryUI() {
            const container = document.getElementById('historyItems');
            container.innerHTML = '';

            playedHistory.forEach((item, i) => {
                const card = document.createElement('div');
                card.className = `track-item ${i === 0 ? 'active' : ''}`;
                
                // Exibe o gênero apenas se a opção selecionada for "TODOS"
                const artistSubtitle = selectedGenre === "ALL" 
                    ? `${item.artist} • ${item.genre}` 
                    : item.artist;

                card.innerHTML = `
                    <div class="track-title">${item.title}</div>
                    <div class="track-artist">${artistSubtitle}</div>
                `;
                container.appendChild(card);
            });
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                setUIState(true);
            } else {
                audio.pause();
                setUIState(false);
            }
        }

        function setUIState(isPlaying) {
            if (isPlaying) {
                playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                playerBar.classList.add('playing');
            } else {
                playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
                playerBar.classList.remove('playing');
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
