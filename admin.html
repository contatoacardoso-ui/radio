<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Central de Rádios - Admin</title>
  <style>
    :root {
      --bg-color: #09090b;
      --card-bg: #18181b;
      --card-border: #27272a;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 20px 16px;
      min-height: 100vh;
    }

    .admin-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    input, select {
      background: #09090b;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: #52525b;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .checkbox-group input {
      width: auto;
      cursor: pointer;
    }

    .checkbox-group label {
      font-size: 0.85rem;
      text-transform: none;
      color: var(--text-main);
      cursor: pointer;
    }

    button.btn-submit {
      background: #f4f4f5;
      color: #09090b;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }

    button.btn-submit:hover {
      opacity: 0.9;
    }

    button.btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 400px;
      overflow-y: auto;
    }

    .track-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #202024;
      border: 1px solid var(--card-border);
      padding: 10px 12px;
      border-radius: 8px;
    }

    .track-info {
      overflow: hidden;
      margin-right: 12px;
    }

    .track-title {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    .status-msg {
      font-size: 0.8rem;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <header>
      <h1>Painel de Controle</h1>
      <p class="subtitle">Gerenciar Músicas e Rádios no GitHub</p>
    </header>

    <!-- Configuração do GitHub -->
    <div class="card">
      <div class="card-title">1. Configuração do Repositório</div>
      <div class="form-group">
        <label>Usuário no GitHub:</label>
        <input type="text" id="gh-owner" placeholder="Ex: joaosilva">
      </div>
      <div class="form-group">
        <label>Nome do Repositório:</label>
        <input type="text" id="gh-repo" placeholder="Ex: central-de-radios">
      </div>
      <div class="form-group">
        <label>Personal Access Token (PAT):</label>
        <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
      </div>
      <button type="button" class="btn-submit" onclick="salvarConfiguracoes()">Salvar Configurações</button>
    </div>

    <!-- Formulário de Cadastro -->
    <div class="card">
      <div class="card-title">2. Adicionar Nova Música</div>
      <form id="add-track-form" onsubmit="adicionarNovaMusica(event)">
        <div class="form-group">
          <label>Título da Música / Rádio:</label>
          <input type="text" id="title" required placeholder="Ex: Boate Azul">
        </div>
        <div class="form-group">
          <label>Artista / Cantor / Emissora:</label>
          <input type="text" id="artist" required placeholder="Ex: Bruno & Marrone">
        </div>
        <div class="form-group">
          <label>Gênero:</label>
          <input type="text" id="genre" required placeholder="Ex: Sertanejo">
        </div>
        <div class="form-group">
          <label>URL da Transmissão (MP3, M4A ou DASH):</label>
          <input type="url" id="url" required placeholder="https://servidor.com/stream.m4a">
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="isDash">
          <label for="isDash">Fluxo DASH / MPD (.mpd)</label>
        </div>
        <button type="submit" class="btn-submit" id="btn-save" disabled>Enviar para o GitHub</button>
      </form>
    </div>

    <!-- Lista Atual -->
    <div class="card">
      <div class="card-title">3. Playlist Cadastrada (<span id="count">0</span>)</div>
      <p class="status-msg" id="status">Carregando dados...</p>
      <div class="track-list" id="track-list"></div>
    </div>
  </div>

  <script>
    var playlist = [];
    var ghConfig = { owner: '', repo: '', path: 'playlist.json', token: '' };

    document.addEventListener('DOMContentLoaded', function() {
      carregarConfiguracoesSalvas();
      carregarPlaylistDoGitHub();
    });

    function carregarConfiguracoesSalvas() {
      ghConfig.owner = localStorage.getItem('gh_owner') || '';
      ghConfig.repo = localStorage.getItem('gh_repo') || '';
      ghConfig.token = localStorage.getItem('gh_token') || '';

      document.getElementById('gh-owner').value = ghConfig.owner;
      document.getElementById('gh-repo').value = ghConfig.repo;
      document.getElementById('gh-token').value = ghConfig.token;

      verificarBotaoSalvar();
    }

    function salvarConfiguracoes() {
      ghConfig.owner = document.getElementById('gh-owner').value.trim();
      ghConfig.repo = document.getElementById('gh-repo').value.trim();
      ghConfig.token = document.getElementById('gh-token').value.trim();

      localStorage.setItem('gh_owner', ghConfig.owner);
      localStorage.setItem('gh_repo', ghConfig.repo);
      localStorage.setItem('gh_token', ghConfig.token);

      alert('Configurações salvas no navegador com sucesso!');
      verificarBotaoSalvar();
      carregarPlaylistDoGitHub();
    }

    function verificarBotaoSalvar() {
      var btn = document.getElementById('btn-save');
      if (ghConfig.owner && ghConfig.repo && ghConfig.token) {
        btn.disabled = false;
      } else {
        btn.disabled = true;
      }
    }

    async function carregarPlaylistDoGitHub() {
      var statusEl = document.getElementById('status');
      var listEl = document.getElementById('track-list');

      if (!ghConfig.owner || !ghConfig.repo) {
        statusEl.innerText = 'Preencha as configurações do GitHub acima.';
        listEl.innerHTML = '';
        return;
      }

      statusEl.innerText = 'Buscando playlist.json no GitHub...';

      try {
        var url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${ghConfig.path}?v=` + new Date().getTime();
        var headers = {};
        if (ghConfig.token) headers['Authorization'] = `token ${ghConfig.token}`;

        var response = await fetch(url, { headers: headers });
        if (!response.ok) throw new Error('Não foi possível ler o arquivo playlist.json');

        var data = await response.json();
        // Decodifica Base64 retornado pelo GitHub com suporte a caracteres UTF-8
        var jsonContent = decodeURIComponent(escape(atob(data.content)));
        playlist = JSON.parse(jsonContent);

        renderTrackList();
        statusEl.innerText = '';
      } catch (err) {
        console.error(err);
        statusEl.innerText = 'Erro ao carregar dados. Verifique as configurações.';
      }
    }

    function renderTrackList() {
      var listEl = document.getElementById('track-list');
      document.getElementById('count').innerText = playlist.length;

      if (playlist.length === 0) {
        listEl.innerHTML = '<p class="status-msg">Nenhuma música cadastrada.</p>';
        return;
      }

      var html = '';
      playlist.forEach(function(track, index) {
        html += `
          <div class="track-item">
            <div class="track-info">
              <div class="track-title">${track.title}</div>
              <div class="track-sub">${track.artist} • <span style="color:var(--text-main);">${track.genre}</span></div>
            </div>
            <button class="btn-delete" onclick="removerMusica(${index})">Excluir</button>
          </div>
        `;
      });
      listEl.innerHTML = html;
    }

    async function adicionarNovaMusica(event) {
      event.preventDefault();

      var novaMusica = {
        title: document.getElementById('title').value.trim(),
        artist: document.getElementById('artist').value.trim(),
        genre: document.getElementById('genre').value.trim(),
        url: document.getElementById('url').value.trim(),
        isDash: document.getElementById('isDash').checked
      };

      // Adiciona na lista atual
      playlist.push(novaMusica);

      // Atualiza o repositório
      await salvarPlaylistNoGitHub(`feat: Adicionada faixa "${novaMusica.title}"`);
      document.getElementById('add-track-form').reset();
    }

    async function removerMusica(index) {
      if (!confirm(`Deseja remover "${playlist[index].title}"?`)) return;

      var removida = playlist.splice(index, 1)[0];
      await salvarPlaylistNoGitHub(`fix: Removida faixa "${removida.title}"`);
    }

    async function salvarPlaylistNoGitHub(commitMessage) {
      var statusEl = document.getElementById('status');
      statusEl.innerText = 'Enviando alterações para o GitHub...';

      try {
        var getUrl = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${ghConfig.path}`;
        var headers = {
          'Authorization': `token ${ghConfig.token}`,
          'Accept': 'application/vnd.github.v3+json'
        };

        // 1. Obter o SHA do arquivo atual no GitHub
        var responseGet = await fetch(getUrl, { headers: headers });
        if (!responseGet.ok) throw new Error('Falha ao obter o arquivo atual.');
        var fileData = await responseGet.json();

        // 2. Converter a nova lista para Base64 com suporte UTF-8
        var jsonString = JSON.stringify(playlist, null, 2);
        var contentBase64 = btoa(unescape(encodeURIComponent(jsonString)));

        // 3. Enviar o PUT com a atualização do arquivo
        var responsePut = await fetch(getUrl, {
          method: 'PUT',
          headers: headers,
          body: JSON.stringify({
            message: commitMessage,
            content: contentBase64,
            sha: fileData.sha
          })
        });

        if (responsePut.ok) {
          alert('Música salva e repositório atualizado!');
          renderTrackList();
          statusEl.innerText = '';
        } else {
          var errData = await responsePut.json();
          throw new Error(errData.message || 'Erro ao gravar no GitHub.');
        }

      } catch (err) {
        console.error(err);
        alert('Erro ao salvar no GitHub: ' + err.message);
        statusEl.innerText = 'Erro ao salvar alterações.';
      }
    }
  </script>
</body>
</html>
