<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painel Administrativo - Central de Rádios</title>
  <style>
    :root {
      --bg-color: #09090b;
      --card-bg: #18181b;
      --card-border: #27272a;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #22c55e;
      --danger: #ef4444;
      --edit: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .admin-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #27272a;
    }

    .btn-primary {
      background: #f4f4f5;
      color: #09090b;
      border: none;
    }

    .btn-primary:hover {
      background: #e4e4e7;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.2);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
    }

    .btn-edit {
      background: rgba(59, 130, 246, 0.1);
      color: var(--edit);
      border-color: rgba(59, 130, 246, 0.2);
    }

    .btn-edit:hover {
      background: var(--edit);
      color: #fff;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"], input[type="url"], select {
      background: #09090b;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 10px;
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #52525b;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: auto;
      padding-bottom: 10px;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--card-border);
    }

    th {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    td {
      color: var(--text-main);
    }

    .actions-cell {
      display: flex;
      gap: 8px;
    }

    /* MODAL DE EDIÇÃO */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      width: 90%;
      max-width: 500px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <header>
      <h1>Gerenciador de Playlist</h1>
      <button class="btn btn-primary" onclick="downloadJSON()">Baixar playlist.json</button>
    </header>

    <!-- FORMULÁRIO DE ADIÇÃO -->
    <div class="card">
      <div class="card-title">Adicionar Nova Música</div>
      <form id="add-form" onsubmit="addTrack(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>Título</label>
            <input type="text" id="add-title" required placeholder="Ex: Song Name">
          </div>
          <div class="form-group">
            <label>Artista</label>
            <input type="text" id="add-artist" required placeholder="Ex: Artist Name">
          </div>
          <div class="form-group">
            <label>Gênero / Rádio</label>
            <input type="text" id="add-genre" required placeholder="Ex: Rock, Pop, Low-fi">
          </div>
          <div class="form-group">
            <label>URL do Áudio</label>
            <input type="url" id="add-url" required placeholder="https://...">
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="add-isDash">
            <label for="add-isDash" style="text-transform:none; cursor:pointer;">Formato DASH (.mpd)</label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 12px; width: fit-content;">Adicionar à Lista</button>
      </form>
    </div>

    <!-- TABELA DE MÚSICAS -->
    <div class="card">
      <div class="card-title">Músicas Cadastradas (<span id="total-tracks">0</span>)</div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Título</th>
              <th>Artista</th>
              <th>Gênero</th>
              <th>Formato</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="playlist-table-body">
            <!-- Linhas geradas via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- MODAL PARA EDITAR REGISTRO -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <div class="card-title">Editar Música</div>
      <input type="hidden" id="edit-index">
      
      <div class="form-group">
        <label>Título</label>
        <input type="text" id="edit-title" required>
      </div>
      <div class="form-group">
        <label>Artista</label>
        <input type="text" id="edit-artist" required>
      </div>
      <div class="form-group">
        <label>Gênero / Rádio</label>
        <input type="text" id="edit-genre" required>
      </div>
      <div class="form-group">
        <label>URL do Áudio</label>
        <input type="url" id="edit-url" required>
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="edit-isDash">
        <label for="edit-isDash" style="text-transform:none; cursor:pointer;">Formato DASH (.mpd)</label>
      </div>

      <div class="modal-actions">
        <button class="btn" onclick="closeEditModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="saveTrackEdit()">Salvar Alterações</button>
      </div>
    </div>
  </div>

  <script>
    let playlist = [];

    document.addEventListener('DOMContentLoaded', () => {
      loadPlaylist();
    });

    async function loadPlaylist() {
      try {
        const response = await fetch('playlist.json?v=' + new Date().getTime());
        if (response.ok) {
          playlist = await response.json();
          renderTable();
        }
      } catch (err) {
        console.warn('Não foi possível carregar o arquivo existente. Começando com lista vazia.');
      }
    }

    function renderTable() {
      const tbody = document.getElementById('playlist-table-body');
      document.getElementById('total-tracks').innerText = playlist.length;

      if (playlist.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--text-muted);">Nenhuma música cadastrada.</td></tr>`;
        return;
      }

      tbody.innerHTML = playlist.map((track, index) => `
        <tr>
          <td><strong>${escapeHtml(track.title || '')}</strong></td>
          <td>${escapeHtml(track.artist || '')}</td>
          <td><span style="background:#27272a; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem;">${escapeHtml(track.genre || 'Sem Gênero')}</span></td>
          <td>${track.isDash ? 'DASH (.mpd)' : 'Direto/MP3'}</td>
          <td class="actions-cell">
            <button class="btn btn-edit" onclick="openEditModal(${index})">Editar</button>
            <button class="btn btn-danger" onclick="deleteTrack(${index})">Excluir</button>
          </td>
        </tr>
      `).join('');
    }

    function addTrack(e) {
      e.preventDefault();

      const newTrack = {
        title: document.getElementById('add-title').value.trim(),
        artist: document.getElementById('add-artist').value.trim(),
        genre: document.getElementById('add-genre').value.trim(),
        url: document.getElementById('add-url').value.trim(),
        isDash: document.getElementById('add-isDash').checked
      };

      playlist.push(newTrack);
      renderTable();

      // Limpa os campos do formulário
      document.getElementById('add-form').reset();
    }

    function deleteTrack(index) {
      if (confirm(`Deseja remover "${playlist[index].title}" da playlist?`)) {
        playlist.splice(index, 1);
        renderTable();
      }
    }

    /* LÓGICA DO MODAL DE EDIÇÃO */
    function openEditModal(index) {
      const track = playlist[index];
      
      document.getElementById('edit-index').value = index;
      document.getElementById('edit-title').value = track.title || '';
      document.getElementById('edit-artist').value = track.artist || '';
      document.getElementById('edit-genre').value = track.genre || '';
      document.getElementById('edit-url').value = track.url || '';
      document.getElementById('edit-isDash').checked = !!track.isDash;

      document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('edit-modal').style.display = 'none';
    }

    function saveTrackEdit() {
      const index = document.getElementById('edit-index').value;

      playlist[index] = {
        title: document.getElementById('edit-title').value.trim(),
        artist: document.getElementById('edit-artist').value.trim(),
        genre: document.getElementById('edit-genre').value.trim(),
        url: document.getElementById('edit-url').value.trim(),
        isDash: document.getElementById('edit-isDash').checked
      };

      closeEditModal();
      renderTable();
    }

    function downloadJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(playlist, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "playlist.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
