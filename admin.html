<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Central de Rádios - Admin Pro</title>
  <style>
    :root {
      --bg-color: #09090b;
      --panel-bg: #121215;
      --card-bg: #18181b;
      --card-border: #27272a;
      --input-bg: #09090b;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --danger: #f43f5e;
      --danger-hover: #e11d48;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    .admin-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .header-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header-title p {
      color: var(--text-muted);
      font-size: 0.78rem;
      margin-top: 2px;
    }

    .btn-icon {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .btn-icon:hover {
      background: #27272a;
      border-color: #3f3f46;
      transform: scale(1.03);
    }

    .btn-icon svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-count {
      background: #27272a;
      color: var(--text-main);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.725rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    input, select {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #52525b;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.05);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
    }

    .checkbox-group input {
      width: 16px;
      height: 16px;
      accent-color: var(--text-main);
      cursor: pointer;
    }

    .checkbox-group label {
      font-size: 0.825rem;
      text-transform: none;
      color: var(--text-main);
      cursor: pointer;
    }

    button.btn-primary {
      background: var(--text-main);
      color: var(--bg-color);
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    button.btn-primary:hover {
      background: #e4e4e7;
    }

    button.btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 360px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .track-list::-webkit-scrollbar {
      width: 4px;
    }

    .track-list::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 4px;
    }

    .track-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 10px 14px;
      border-radius: 10px;
      transition: border-color 0.2s;
    }

    .track-item:hover {
      border-color: #3f3f46;
    }

    .track-info {
      overflow: hidden;
      margin-right: 12px;
    }

    .track-title {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-delete {
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.2);
      color: var(--danger);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn-delete:hover {
      background: var(--danger);
      color: #fff;
    }

    .status-msg {
      font-size: 0.8rem;
      text-align: center;
      color: var(--text-muted);
      padding: 12px 0;
    }

    /* Modal de Configurações */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-card {
      background: var(--panel-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      animation: modalFadeIn 0.2s ease-out;
    }

    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 10px;
    }

    .modal-header h2 {
      font-size: 1rem;
      font-weight: 600;
    }

    .btn-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .btn-close:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <header>
      <div class="header-title">
        <h1>Painel de Controle</h1>
        <p>Lançamento de Músicas & Rádios</p>
      </div>
      <button class="btn-icon" onclick="abrirModalConfig()" title="Configurações do GitHub">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Formulário de Lançamento -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">Novo Lançamento</div>
      </div>
      <form id="add-track-form" onsubmit="adicionarNovaMusica(event)">
        <div class="form-group">
          <label>Título da Música / Rádio:</label>
          <input type="text" id="title" required placeholder="Ex: Boate Azul">
        </div>
        <div class="form-group">
          <label>Artista / Cantor / Emissora:</label>
          <input type="text" id="artist" required placeholder="Ex: Bruno & Marrone">
        </div>
        <div class="form-group">
          <label>Gênero:</label>
          <input type="text" id="genre" required placeholder="Ex: Sertanejo">
        </div>
        <div class="form-group">
          <label>URL do Stream (MP3, M4A ou DASH):</label>
          <input type="url" id="url" required placeholder="https://servidor.com/stream.m4a">
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="isDash">
          <label for="isDash">Fluxo DASH / MPD (.mpd)</label>
        </div>
        <button type="submit" class="btn-primary" id="btn-save" disabled>
          Lançar no Servidor
        </button>
      </form>
    </div>

    <!-- Lista de Faixas Cadastradas -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">Programação Atual</div>
        <span class="badge-count" id="count">0</span>
      </div>
      <p class="status-msg" id="status">Carregando dados...</p>
      <div class="track-list" id="track-list"></div>
    </div>
  </div>

  <!-- Modal de Configuração do GitHub -->
  <div class="modal-overlay" id="modal-config">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Credenciais do GitHub</h2>
        <button class="btn-close" onclick="fecharModalConfig()">&times;</button>
      </div>
      <div class="form-group">
        <label>Usuário no GitHub:</label>
        <input type="text" id="gh-owner" placeholder="Ex: joaosilva">
      </div>
      <div class="form-group">
        <label>Nome do Repositório:</label>
        <input type="text" id="gh-repo" placeholder="Ex: central-de-radios">
      </div>
      <div class="form-group">
        <label>Personal Access Token (PAT):</label>
        <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
      </div>
      <button type="button" class="btn-primary" onclick="salvarConfiguracoes()">Salvar Credenciais</button>
    </div>
  </div>

  <script>
    var playlist = [];
    var ghConfig = { owner: '', repo: '', path: 'playlist.json', token: '' };

    document.addEventListener('DOMContentLoaded', function() {
      carregarConfiguracoesSalvas();
      carregarPlaylistDoGitHub();
    });

    function abrirModalConfig() {
      document.getElementById('modal-config').style.display = 'flex';
    }

    function fecharModalConfig() {
      document.getElementById('modal-config').style.display = 'none';
    }

    function carregarConfiguracoesSalvas() {
      ghConfig.owner = localStorage.getItem('gh_owner') || '';
      ghConfig.repo = localStorage.getItem('gh_repo') || '';
      ghConfig.token = localStorage.getItem('gh_token') || '';

      document.getElementById('gh-owner').value = ghConfig.owner;
      document.getElementById('gh-repo').value = ghConfig.repo;
      document.getElementById('gh-token').value = ghConfig.token;

      verificarBotaoSalvar();
    }

    function salvarConfiguracoes() {
      ghConfig.owner = document.getElementById('gh-owner').value.trim();
      ghConfig.repo = document.getElementById('gh-repo').value.trim();
      ghConfig.token = document.getElementById('gh-token').value.trim();

      localStorage.setItem('gh_owner', ghConfig.owner);
      localStorage.setItem('gh_repo', ghConfig.repo);
      localStorage.setItem('gh_token', ghConfig.token);

      fecharModalConfig();
      verificarBotaoSalvar();
      carregarPlaylistDoGitHub();
    }

    function verificarBotaoSalvar() {
      var btn = document.getElementById('btn-save');
      if (ghConfig.owner && ghConfig.repo && ghConfig.token) {
        btn.disabled = false;
      } else {
        btn.disabled = true;
      }
    }

    async function carregarPlaylistDoGitHub() {
      var statusEl = document.getElementById('status');
      var listEl = document.getElementById('track-list');

      if (!ghConfig.owner || !ghConfig.repo) {
        statusEl.innerHTML = 'Clique no ícone de <b>Engrenagem</b> acima para configurar o GitHub.';
        listEl.innerHTML = '';
        return;
      }

      statusEl.innerText = 'Sincronizando com o repositório...';

      try {
        var url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${ghConfig.path}?v=` + new Date().getTime();
        var headers = {};
        if (ghConfig.token) headers['Authorization'] = `token ${ghConfig.token}`;

        var response = await fetch(url, { headers: headers });
        if (!response.ok) throw new Error('Não foi possível carregar playlist.json');

        var data = await response.json();
        var jsonContent = decodeURIComponent(escape(atob(data.content)));
        playlist = JSON.parse(jsonContent);

        renderTrackList();
        statusEl.innerText = '';
      } catch (err) {
        console.error(err);
        statusEl.innerText = 'Erro ao conectar. Verifique as credenciais na Engrenagem.';
      }
    }

    function renderTrackList() {
      var listEl = document.getElementById('track-list');
      document.getElementById('count').innerText = playlist.length;

      if (playlist.length === 0) {
        listEl.innerHTML = '<p class="status-msg">Nenhuma música cadastrada no momento.</p>';
        return;
      }

      var html = '';
      playlist.forEach(function(track, index) {
        html += `
          <div class="track-item">
            <div class="track-info">
              <div class="track-title">${track.title}</div>
              <div class="track-sub">${track.artist} • <span style="color:var(--text-main);">${track.genre}</span></div>
            </div>
            <button class="btn-delete" onclick="removerMusica(${index})">Remover</button>
          </div>
        `;
      });
      listEl.innerHTML = html;
    }

    async function adicionarNovaMusica(event) {
      event.preventDefault();

      var novaMusica = {
        title: document.getElementById('title').value.trim(),
        artist: document.getElementById('artist').value.trim(),
        genre: document.getElementById('genre').value.trim(),
        url: document.getElementById('url').value.trim(),
        isDash: document.getElementById('isDash').checked
      };

      playlist.push(novaMusica);

      await salvarPlaylistNoGitHub(`feat: Lançamento de "${novaMusica.title}"`);
      document.getElementById('add-track-form').reset();
    }

    async function removerMusica(index) {
      if (!confirm(`Deseja remover "${playlist[index].title}"?`)) return;

      var removida = playlist.splice(index, 1)[0];
      await salvarPlaylistNoGitHub(`fix: Removida faixa "${removida.title}"`);
    }

    async function salvarPlaylistNoGitHub(commitMessage) {
      var statusEl = document.getElementById('status');
      statusEl.innerText = 'Enviando alterações para o GitHub...';

      try {
        var getUrl = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${ghConfig.path}`;
        var headers = {
          'Authorization': `token ${ghConfig.token}`,
          'Accept': 'application/vnd.github.v3+json'
        };

        var responseGet = await fetch(getUrl, { headers: headers });
        if (!responseGet.ok) throw new Error('Falha ao obter o arquivo atual.');
        var fileData = await responseGet.json();

        var jsonString = JSON.stringify(playlist, null, 2);
        var contentBase64 = btoa(unescape(encodeURIComponent(jsonString)));

        var responsePut = await fetch(getUrl, {
          method: 'PUT',
          headers: headers,
          body: JSON.stringify({
            message: commitMessage,
            content: contentBase64,
            sha: fileData.sha
          })
        });

        if (responsePut.ok) {
          renderTrackList();
          statusEl.innerText = '';
        } else {
          var errData = await responsePut.json();
          throw new Error(errData.message || 'Erro ao gravar no GitHub.');
        }

      } catch (err) {
        console.error(err);
        alert('Erro ao salvar no GitHub: ' + err.message);
        statusEl.innerText = 'Erro ao salvar alterações.';
      }
    }
  </script>
</body>
</html>
