<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin Auto-Sync - WebRadio</title>
    <style>
        :root {
            --accent: #00f2ff;
            --bg-main: #121212;
            --bg-card: #181818;
            --text-main: #ffffff;
            --text-muted: #888888;
            --danger: #ff4444;
            --success: #00ff88;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .auth-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #121212;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 999;
        }

        .auth-overlay.hidden { display: none; }
        h1, h2, h3 { margin-bottom: 15px; }
        
        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: bold;
            text-transform: uppercase;
        }

        input {
            background: var(--bg-card);
            border: 1px solid #333;
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus { border-color: var(--accent); }

        .checkbox-group {
            flex-direction: row;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }

        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }

        .btn:active { transform: scale(0.98); }

        .btn-save {
            background: var(--success);
            color: #000;
            font-size: 16px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid #222;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .track-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid #222;
            padding: 12px 15px;
            border-radius: 8px;
        }

        .track-info-title { font-weight: bold; font-size: 14px; }
        .track-info-sub { font-size: 12px; color: var(--text-muted); }

        .btn-del {
            background: none;
            border: 1px solid var(--danger);
            color: var(--danger);
            font-weight: bold;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
        }

        #statusMsg {
            margin-top: 10px;
            font-size: 13px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Autenticação Admin -->
    <div class="auth-overlay" id="authOverlay">
        <h2>Acesso Restrito</h2>
        <div class="form-group" style="width: 100%; max-width: 280px;">
            <input type="password" id="pinInput" placeholder="Senha Admin">
            <button class="btn" onclick="checkAuth()">Entrar</button>
        </div>
    </div>

    <h2>Gerenciador da Rádio (Auto-Sync)</h2>

    <!-- Configuração da API do GitHub -->
    <div class="card">
        <h3>Configuração de Sincronização</h3>
        <div class="form-group">
            <label>Usuário GitHub / Repositório</label>
            <input type="text" id="ghRepo" placeholder="seu-usuario/seu-repositorio">
        </div>
        <div class="form-group">
            <label>GitHub Personal Access Token (PAT)</label>
            <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
        </div>
        <button class="btn" style="background: #333; color: #fff;" onclick="saveConfig()">Salvar Chave no Navegador</button>
    </div>

    <!-- Formulário para Adicionar Música -->
    <div class="card">
        <h3>Adicionar Nova Faixa</h3>
        <div class="form-group">
            <label>Título da Música / Show</label>
            <input type="text" id="title" placeholder="Ex: Chicos No Samba">
        </div>
        <div class="form-group">
            <label>Artista / DJ</label>
            <input type="text" id="artist" placeholder="Ex: Gimenes Grooveria">
        </div>
        <div class="form-group">
            <label>Gênero</label>
            <input type="text" id="genre" placeholder="Ex: Samba & MPB">
        </div>
        <div class="form-group">
            <label>URL do Áudio (.m4a ou .mpd)</label>
            <input type="text" id="url" placeholder="https://...">
        </div>
        <div class="form-group checkbox-group">
            <input type="checkbox" id="isDash">
            <label for="isDash" style="text-transform: none; color: #fff;">É stream DASH (.mpd)?</label>
        </div>
        <button class="btn" onclick="addTrack()">+ Adicionar à Lista Local</button>
    </div>

    <h3>Músicas Atuais (<span id="count">0</span>)</h3>
    <br>
    <div class="track-list" id="trackList"></div>

    <br><hr style="border-color: #222;"><br>

    <!-- Botão de Atualização Automática -->
    <div class="card">
        <button class="btn btn-save" id="saveBtn" onclick="commitToGitHub()">☁️ Publicar Alterações no GitHub</button>
        <div id="statusMsg"></div>
    </div>

    <script>
        const ADMIN_PIN = "1234";
        let playlist = [];
        let fileSHA = ""; // Necessário para atualizar arquivos via API do GitHub

        function checkAuth() {
            if (document.getElementById('pinInput').value === ADMIN_PIN) {
                document.getElementById('authOverlay').classList.add('hidden');
                loadStoredConfig();
                fetchFromGitHub();
            } else {
                alert('Senha incorreta!');
            }
        }

        function loadStoredConfig() {
            if (localStorage.getItem('gh_repo')) document.getElementById('ghRepo').value = localStorage.getItem('gh_repo');
            if (localStorage.getItem('gh_token')) document.getElementById('ghToken').value = localStorage.getItem('gh_token');
        }

        function saveConfig() {
            localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
            localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
            alert('Configurações salvas no navegador!');
            fetchFromGitHub();
        }

        // Carrega o playlist.json usando a API do GitHub para obter a SHA do arquivo
        async function fetchFromGitHub() {
            const repo = localStorage.getItem('gh_repo');
            if (!repo) return renderList();

            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/playlist.json?t=` + new Date().getTime());
                if (res.ok) {
                    const data = await res.json();
                    fileSHA = data.sha;
                    // Decodifica Base64 retornado pela API do GitHub
                    const content = decodeURIComponent(escape(atob(data.content)));
                    playlist = JSON.parse(content);
                }
            } catch (e) {
                console.error("Erro ao buscar dados do GitHub:", e);
            }
            renderList();
        }

        function renderList() {
            const listEl = document.getElementById('trackList');
            document.getElementById('count').innerText = playlist.length;
            listEl.innerHTML = '';

            playlist.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = 'track-item';
                item.innerHTML = `
                    <div>
                        <div class="track-info-title">${track.title}</div>
                        <div class="track-info-sub">${track.artist} • <span style="color: var(--accent);">${track.genre}</span></div>
                    </div>
                    <button class="btn-del" onclick="removeTrack(${index})">Excluir</button>
                `;
                listEl.appendChild(item);
            });
        }

        function addTrack() {
            const title = document.getElementById('title').value.trim();
            const artist = document.getElementById('artist').value.trim();
            const genre = document.getElementById('genre').value.trim();
            const url = document.getElementById('url').value.trim();
            const isDash = document.getElementById('isDash').checked;

            if (!title || !artist || !genre || !url) {
                alert('Preencha todos os campos!');
                return;
            }

            playlist.unshift({ title, artist, genre, url, isDash });
            renderList();

            document.getElementById('title').value = '';
            document.getElementById('artist').value = '';
            document.getElementById('genre').value = '';
            document.getElementById('url').value = '';
            document.getElementById('isDash').checked = false;
        }

        function removeTrack(index) {
            playlist.splice(index, 1);
            renderList();
        }

        // Envia o JSON atualizado direto para o GitHub sem copiar/colar
        async function commitToGitHub() {
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');
            const statusEl = document.getElementById('statusMsg');

            if (!repo || !token) {
                alert('Preencha o repositório e o Token do GitHub no topo da página antes de salvar.');
                return;
            }

            statusEl.style.color = 'var(--accent)';
            statusEl.innerText = 'Enviando alterações para o GitHub...';

            // Codifica o JSON em Base64
            const jsonString = JSON.stringify(playlist, null, 2);
            const contentBase64 = btoa(unescape(encodeURIComponent(jsonString)));

            const payload = {
                message: "Atualização via Painel Admin WebRadio",
                content: contentBase64,
                sha: fileSHA
            };

            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/playlist.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    const resData = await res.json();
                    fileSHA = resData.content.sha; // Atualiza a SHA com a nova versão
                    statusEl.style.color = 'var(--success)';
                    statusEl.innerText = '✅ Playlist atualizada no GitHub com sucesso!';
                } else {
                    const err = await res.json();
                    statusEl.style.color = 'var(--danger)';
                    statusEl.innerText = 'Erro ao salvar: ' + (err.message || 'Verifique o Token');
                }
            } catch (e) {
                statusEl.style.color = 'var(--danger)';
                statusEl.innerText = 'Erro de conexão com o GitHub.';
            }
        }
    </script>
</body>
</html>
